name: Lint

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so Super-Linter can diff against the base branch.
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter/slim@v8.7.0
        env:
          # Lint only files changed in this push / PR. The repo has hundreds of
          # pre-existing content files that were never linted; checking the whole
          # codebase would fail the build on day one. Flip to true for a full sweep.
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opt-in mode: setting any VALIDATE_* to true restricts Super-Linter to
          # only those linters. This is a Markdown-driven Jekyll site, so we lint
          # the Markdown content and leave infra YAML and vendor CSS/fonts alone.
          VALIDATE_MARKDOWN: true
          # Single source of truth: the markdownlint config lives at the repo
          # root as .markdownlint.yaml -- the name editor extensions auto-detect
          # -- so the IDE and CI lint with identical rules. Point Super-Linter
          # there (its default would be .github/linters/.markdown-lint.yml).
          LINTER_RULES_PATH: .
          MARKDOWN_CONFIG_FILE: .markdownlint.yaml
