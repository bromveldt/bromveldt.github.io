name: Lint

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so Super-Linter can diff against the base branch.
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter/slim@v8.2.0
        env:
          # Lint only files changed in this push / PR. The repo has hundreds of
          # pre-existing content files that were never linted; checking the whole
          # codebase would fail the build on day one. Flip to true for a full sweep.
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These scanners ignore VALIDATE_ALL_CODEBASE and always sweep the whole
          # repo — disable them so runs stay scoped to changed files and quiet.
          VALIDATE_JSCPD: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_BIOME_FORMAT: false
