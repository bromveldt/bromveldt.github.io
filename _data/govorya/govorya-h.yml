- pom: [ХарпАль]
  rus:
    - t: короткая летняя куртка морехода, наподобие бушлата
      e: [ "ХарпАль в сенЯх вЕснёт" ]
- pom: [ХАрьюз]
  rus:
    - t: рыба хариус
      e: [ "ХарпАль в сенЯх вЕснёт" ]
- pom: [ХАрьюз]
  rus:
    - t: рыба хариус
- pom: [ХАря]
  rus:
    - t: святочная маска
      e: [ "ШулихОны Элаки хАри-то носИли" ]
- pom: [ХвалЁна]
  rus:
    - t: похвальное прозвище для девушки, наподобие «молодЕц» для юноши
      e: [ "Поди-ко сюдЫ, хвалЁна, — слАдиньку козУльку дам" ]
- pom: [ХвОстать]
  rus:
    - t: стегать
      e: [ "ЦиснЯк в бАйны — хвОстацце", "ВеникАма в бАйных вОшшуцце", "ХвостанУ — ковоття!" ]
- pom: [ХивусА, хИвусьё]
  rus:
    - t: снежная буря в виде позёмки
      e: [ "ХивусА пАли – волОсьё снЕжно вьЁцце" ]
- pom: [ХимрЯк, химрА]
  rus:
    - t: мощный, ревущий ветер, ураган с осадками
      e: [ "ХимрЯк-от как б зафиЮсил – химрА пАла" ]
- pom: [ХИюс]
  rus:
    - t: стелющаяся поземка
      e: [ "По дорОги-то хИюс вЕртит" ]
- pom: [ХлУдьё]
