    - t: мелкие веточки деревьев, хворост
      e: [ "ХлУдьё-то хрУмкат — когО ишшО лЕшшой несЁт?" ]
      c: [ окомЕльё ]
- pom: [Ход]
  rus:
    - t: маршрут
      e: [ "ГрумалАньским хОдом бегАли", "Вы кОторым хОдом похОдите?"]
- pom: [хОжат]
  rus:
    - t: искать, разведовать
      e: [ "ЦелОй упрЯк по гУбки хОжат"]
