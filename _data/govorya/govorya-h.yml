    - t: разведка, поиск
      e: [ "ЗвЕря хОжали, дак у кАжного свой хоз был"]
- pom: [ХозЯва]
  rus:
    - t: хозяева
      e: [ "Да какИ онЕ к лЕшшому хозЯва-то!" ]
- pom: [ХозЯфской]
