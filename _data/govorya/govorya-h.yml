    e: [ "В хАрвы-то турЫ спроЁм — нать ей вЫтрушить" ]
- pom: [ХармовАтой]
  rus:
    - t: выцветший, выбеленный
      e: [ "ПесцЁва-то скУрка лЕтом хармовАта, да цяпурнА" ]
