letter: Ю
entries:
  - pom: [ЮндА]
    rus:
      - t: длинный ряд из связанных вместе сетей
        e: ["ЮндЫ нОнце не стАвим"]
  - pom: [Юпа, хЮпа]
    rus:
      - t: мужская крестьянская суконная длинная одежда с капюшоном, надеваемая через голову
        e: ["В хЮпах мурмАншшики ходИли"]
        c: [кАбат, совИк]
  - pom: [ЮрИть]
    rus:
      - t: перебегать зигзагами из одного места в другое, прячась и запутывая противника
        e: ["ВЕкша по кОмлю юрИт", "МорьскОй зАиц выЮриват"]
  - pom: [ЮркИ]
    rus:
      - t: свернутые и связанные в виде длинной трубы шкуры убитых морских животных. Такую «трубу» из связанных шкур промышленнику легче тащить по льду или буксировать за лодкой
        e: ["НовОй раз юркИ долгУшши везАли"<sup>2</sup>]
  - pom: [Юрмолы, Урмолы]
    rus:
      - t: заливные луга в низинах, по берегам рек и островов
        e: ["О КолмогОрьё Этта РАкульска Юрмола да Батьурмола"]
  - pom: [ЮрО, юрОво]
    rus:
      - t: залежка стад морского зверя
        e: ["Моржа Этта юрОво"]
      - t: рыбий косяк
        e: ["ЮрОво рЫбьё сюдЫ кАтицце"]
  - pom: [ЮрОфшшик]
    rus:
      - t: главный зверопромышленник на промысле морского зверя
  - pom: [ЮхлА]
    rus:
      - t: мокрый мелкий снег при сильном ветре
        r: [нАлепь, обнУтка, шИпша]
  - pom: [ЮхтА]
    rus:
      - t: снег или осколки льда в проруби
        r: [бАколда, колтацьЁ, бим]
