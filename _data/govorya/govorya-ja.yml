letter: Я
entries:
  - pom: [ЯгабОвны]
    rus:
      - t: мифологические персонажи поморских сказок, дочери Бабы-Яги
  - pom: [Ягры]
    rus:
      - t: песчаные большие отмели обсыхающие во время *обрОна* воды
  - pom: [Ялово]
    rus:
      - t: опустошенное безрыбное место в реке, обловленная рыбная яма
        e: ["Этта Озеро-то Ялово – немА рЫбы Этта"]
  - pom: [ЯмИга]
    rus:
      - t: бечева для связывания отдельных кусков сети в единую снасть
  - pom: [Яндиця]
    rus:
      - t: исподняя женская шубка из оленьего меха шерстью внутрь (надевается в сильные морозы)
  - pom: [Ярник]
    rus:
      - t: карликовая береза
        e: ["Во Ярнику-то спроЁммо-рОшки"]
  - pom: [ЯровОдьё]
    rus:
      - t: большой прилив во время полнолуния или новолуния
        e: ["ПерекрОй – дак пАло яровОдьё"]
        r: [ перекрОй ]
  - pom: [Ярус]
    rus:
      - t: рыболовная морская снасть для ловли трески, наподобие огромного продольника
        r: [оростЕги, фОршни, Уды]
  - pom: [ЯрЫ]
    rus:
      - t: сапоги с голенищами выше колен, мехом наружу. Шьются из шкуры, снятой с ног оленя, красятся ольховым отваром в красный цвет
        e: ["ПрЕжэ ярЫ-то пАрни носИли"]
  - pom: [ЯснЕць]
    rus:
      - t: прозрачный осенний лед, сквозь который хорошо видно дно
        e: ["ШшУка скрозь яснЕць-от видАть"]

