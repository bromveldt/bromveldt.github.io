letter: Ц
entries:
  - pom: [ЦвиркАць]
    rus:
      - t: тяжелый и мелкий речной песок, при ходьбе по которому раздаются резкие, высокие звуки
        e: ["ПесОк-от Этта порАто цвИркат", "ЦвиркАць Этта песОк-от"]
  - pom: [ЦЕрьё]
    rus:
      - t: трут
        e: ["ОгнЮ нать пАкула, ль цЕрьё какО"]
  - pom: [ЦёврУй]
    rus:
      - t: низменный берег покрытый цеврОй
        r: [цеврА]
  - pom: [ЦеврА, цёврА]
    rus:
      - t: мелкий гравий, галька, песок
        e: ["ЦёврЫ-то мОрё нарЫло"]
        r: [ цюрА ]
      - t: Шершавая поверхность
        e: [ "ОцЕрвела кОжа-то" ]
      - t: Крупно-зернистый наст
        e: [ "ЦеврАстой снег-от — цеврА" ]
  - pom: [ЦЕйной]
    rus:
      - t: чей
        e: [ "Этта цЕйна лОдоцька-то?" ]
  - pom: [ЦЕльма]
    rus:
      - t: мелкий пролив, соединяющий два озера
        r: [ перекАль ]
  - pom: [ЦеморИця, комарИця]
    rus:
      - t: ядовитое луговое многолетнее растение Чемерица Лобеля, с широкими крупными листьями, растущее на заболоченных лугах. Жители Нижнетоемского района Архангельской губернии использовали цеморИцю в знахарских обрядах. Для этого кусочек теста заворачивали в ядовитые листья цеморицы, обмазывали все это глиной и пекли в горячей золе. Затем засохшую глину разламывали, вынимали запеченное «цеморИшно» и носили на теле как амулет, а иногда даже ели его. Считалось, что это спасает от комаров и гнуса в период сенокоса.
  - pom: [ЦёмОрь]
    rus:
      - t: нечистый дух заболоченных лугов, болотный хозяин
        e: [ "ЦёмОрь-от в цярусА затЯгиват — дак ненатьего поминАть" ]
        r: [ верьгОй ]
  - pom: [ЦёрдАк]
    rus:
      - t: трюм на поморских судах, закрытый отсек на судне для свежепойманной рыбы
        e: ["ЦёрдакИ бЫли на йОлах"]
        r: [ вЫшка, подволОка ]
  - pom: [ЦЁрёп]
    rus:
      - t: горшок для сметаны, масла
        e: ["НесИ-ко со лЕдника цЁрёп — гостЯм поИсьти"]
  - pom: [ЦибАка]
    rus:
      - t: шапка в виде мехового круглого шлема
        e: ["ЦибАка с дОлгима ушАма"]
        r: [ оплицЮха ]
  - pom: [ ЦибардАть ]
    rus:
      - t: чирикать
        e: [ "ВоробЕйко цибардАт" ]
  - pom: [ ЦивастИга ]
    rus:
      - t: аркан
        e: [ "ЦивастИга самоЕтска — тынзЕй" ]
        r: [ тынзЕй ]
  - pom: [ ЦИВЬЁ, цЕвьё ]
    rus:
      - t: рукоятка гарпуна, ножа, лопаты, серпа и т.д.
        e: [ "КУтило-то со дОлгим цИвьём" ]
        r: [ кУтило ]
  - pom: [ Циг, цИгла, цИга, цИгаць ]
    rus:
      - t: мошкара, гнус
        e: [ "ЦИгла Этта ОСОБОМ лЁтат" ]
  - pom: [ ЦИдёга ]
    rus:
      - t: моросящий дождь
        e: [ "ЦямрА да цИдёга пАла" ]
  - pom: [ ЦилЁма ]
    rus:
      - t: тундряная трясина
        e: [ "На олЕшках по цилЁмы Ездят" ]
      - t: Вода из болота
        e: [ "Ты целЁмы-то нЕпил?" ]
  - pom: [ Цин ]
    rus:
      - t: порядок
        e: [ "Этта, бывАт, свой цин — СВОЁ уставнО" ]
  - pom: [ ЦИнёга ]
    rus:
      - t: мелкий моросящий осенний дождик со снегом
        e: [ "То цИнёга, то мусЁнка пАдат" ]
  - pom: [ ЦиридИть ]
    rus:
      - t: потрошить, чистить, разделывать рыбу или зверя
        e: [ "ОснимАй воперьвО звЕря – опослЯ циридИ" ]
        r: шкЕрить
  - pom: [ ЦиснЯк ]
    rus:
      - t: березовый веник с гладким незазубренным листом
        e: [ "В бАйны-то хвОстацце — нать циснЯк" ]
        c: голИк
  - pom: [ Црён ]
    rus:
      - t: большой котел
        e: [ "ПрЕжнёй-то бАенной црён нагорЕл" ]
      - t: Котёл для вываривания соли
        e: [ "В КУлое црён стоЯл желЁзной" ]
        c: кОтло
  - pom: [ Цюм ]
    rus:
      - t: ковш
        e: [ "МАхонна цюмИцька — брАжку пИть" ]
      - t: Поморское название переносного жилища оленеводов
        e: [ "СамоЯда цЮмом не назовУт; по-ихнЁму цюм-от — мя" ]
  - pom: [ ЦЮнки ]
    rus:
      - t: небольшие санки («цЮнки гулЁбны» — санки для перевозки людей, а «цЮнки ежжАлы» — для перевозки грузов)
  - pom: [ цюрА ]
    rus:
      - t: песок в полосе прибоя, вперемешку с мелкими камешками и мусором
        e: [ "ЦюрЫ да вахтЫ нарЫло" ]
  - pom: [ ЦюшшИна ]
    rus:
      - t: за чужой счет, бесплатно
        e: [ "Мне-ка на цюшшИну-то брАжки не нать" ]
  - pom: [ ЦябАрь ]
    rus:
      - t: птенец чайки
        e: [ "Неопрятный человек, неряха" ]
  - pom: [ ЦямрА ]
    rus:
      - t: мелкий моросящий дождь в сумрачную погоду, морось с туманом
        e: [ "ЦямрА падЁт – дак мУсоко, цИнега" ]
  - pom: [ ЦЯнга ]
    rus:
      - t: жердь для чума
        e: [ "ЦянганА-то гладЁхонько тЁшут" ]
  - pom: [ ЦЯпфы, цЯпки, цепАхи, кАтры, кАрти ]
    rus:
      - t: особые чесалки в виде плоских деревянных лопаточек с металлическими шипами для расчесывания шерсти
        e: [ "В кАжну рУку — по цепАхи" ]
  - pom: [ ЦяпурнА ]
    rus:
      - t: вылинявшие места на шкуре, проплешины
        e: [ "СкУрка-то цяпурнА" ]
        r: [ хармовАтой ]
  - pom: [ ЦЯрусь, цярусьЁ ]
    rus:
      - t: черная трясина на торфяном болоте
        e: [ "Этта болОтна ФсАця — цЯрусьё" ]
  - pom: [ ЦЁваль ]
    rus:
      - t: замороженные для длительного хранения ягоды морошки-рОхлеця, брусники, клюквы
        e: [ "ЦЁваль на лЕднике в церёпАх дЁржим" ]
