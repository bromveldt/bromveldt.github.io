letter: Н
entries:
- pom: [НабедУ]
  rus:
    - t: очень
      e: ["ПорАто хоцЮ евО свидАть, набедУ об ём скуцЯю"]
- pom: [НабирУха]
  rus:
    - t: приливная волна
      e: ["НабирУха-то вОна какО жАрит"]
      r: [накАт, нагОн]
- pom: [НавекУ]
  rus:
    - t: никогда, отродясь, сроду
      e: ["НавекУ такОго не бывАло"]
      r: [ввек, векОм]
- pom: [НавЕрить]
  rus:
    - t: довериться
      e: ["КорЮ евО: поштО ей-то навЕрилссе?"]
- pom: [НаводопЕлой]
  rus:
    - t: разбухший от воды
      e: ["ТоплЯк-от наводопЕлой, дак не вЫзнеть с водЫ"]
- pom: [НАволок]
  rus:
    - t: мыс, полуостров
      e: ["КОлу рАне звАли ТЕрьской НАволок"]
    - t: низкий берег на мысу
      a: мыс Пурнаволок в Архангельске
- pom: [НаглОхтилссе]
  rus:
    - t: нахлебался, наглотался
      e: ["ВодЫ-то наглОхтиссе, дак уж не вЫплыть"]
- pom: [НагОн]
  rus:
    - t: морская вода, нагоняемая ветром с моря в устья рек
      e: ["НагОн-от падЁт, дак водА во рекИ солонЮшша"]
      r: [морЯна]
- pom: [НадЕя]
  rus:
    - t: надежда
      e: ["НОныдеты моЯ послЕдня надЕя"]
- pom: [НадЁван]
  rus:
    - t: надет
      e: ["Под совИк-от мАлицьна рубАха надЁвана"]
- pom: [НазОльно]
  rus:
    - t: досадно
      e: ["ЕмУ, бывАт, тОже назОльно"]
- pom: [НаЕда]
  rus:
    - t: сытая пища
      e: ["СОлоно, волОжено; скУсна брАшна – хорошА наЕда"]
      r: [ненаЕда]
- pom: [НаедИнась]
  rus:
    - t: один на один
      e: ["ДЕдко-то СеверьЯн наедИнась медвЕдя уходИл"]
      r: [уходИть]
- pom: [НажИвоцьник]
  rus:
    - t: член промысловой артели, который наживлял наживку (обычно мойву) на уды яруса для ловли трески
- pom: [НажИфшшик]
  rus:
    - t: добытчик
      e: ["МужИк-от у ей нажИфшшик – мнОго жИро нАжили"]
      r: [жИро]
- pom: [НажОмной]
  rus:
    - t: ветер, прибивающий льды к берегу
      e: ["СиверОк – нажОмной вЕтёр"]
- pom: [НАзвишшё]
  rus:
    - t: название
      e: ["КакО Элако нАзвишшё-то у евО?"]
- pom: [НазЁм]
  rus:
    - t: навоз
      e: ["НазЁму нать на огорОды"]
- pom: [НазникАть]
  rus:
    - t: не обращать внимания
      e: ["НазникАй-ко ты об их"]
- pom: [НакАрной]
  rus:
    - t: рыхлый, талый и поэтому ненадежный лёд
      e: ["На бЫстреди накАрной лёд"]
      r: [хрОмкой]
- pom: [НакАт]
  rus:
    - t: сильный морской прилив
      e: ["НакАтом вОда спОлнилассе"]
      r: [набирУха]
- pom: [НаколЮшка]
  rus:
    - t: шило
      e: ["НаколЮшка во стенЫ вОткнута"]
- pom: [НакОн]
  rus:
    - t: раз
      e: ["ДвОи накОн ходИл в лЕсы-то", "ДругОй-от накОн уж не пойдУ"]
- pom: [НАлепь]
  rus:
    - t: мокрый снег, налипающий на стволах деревьев, мачтах, столбах и т.д.
      r: [обнУтка, шИпша, юхлА]
- pom: [НаливА]
  rus:
    - t: стена проливного дождя
      e: ["ГлядИ-ко какА наливА-то кАтит – нать лОдки не запрУжило"]
- pom: [НамОина]
  rus:
    - t: мель в устье реки, меняющая своё место из года в год
      e: ["Во МезЕньской губЫ намОины"]
- pom: [НапружИть]
  rus:
    - t: пролить, сделать лужу, разлить
      e: ["СерЁтка Избы кот напрУжил"]
      r: [пружИть]
- pom: [НароцИть]
  rus:
    - t: нацепить
      e: ["НароцЯт кОноки – дак баскО им кАжёт"]
      r: [кОноки, баскО]
- pom: [НаслЕжник]
  rus:
    - t: следопыт
      e: ["Он хОжал звЕря-то: наслЕжник хорОшой был"]
- pom: [НаслЕжницять]
  rus:
    - t: идти по следу
- pom: [НАслуд]
  rus:
    - t: твердая ледяная корка, образующаяся поверх льда от выступившей при приливах воды
      r: [кОгва, кОлва, шапнЯ, хАвра]
- pom: [НаспИцьник]
  rus:
    - t: полотенце, висящее на воткнутой в стену спице у умывальника
      e: ["НаспИцьником-то утрИ лИцюшко"]
- pom: [НастАть]
  rus:
    - t: занять пост, приступить к выполнению обязанностей
      e: ["НастАл цярь-от на цЯрьссво"]
- pom: [НАстежь]
  rus:
    - t: широко
      e: ["ВорОцця нАстежь пОлы"]
      p: ["ВорОцця напетУ отвОрены"]
- pom: [НатакАть]
  rus:
    - t: убеждать, надоумливать
      e: ["НатакАла веть неходИть тОйдысь"]
- pom: [Нать]
  rus:
    - t: надо
      e: ["Мне Элако не нать"]
- pom: [НахОдит]
  rus:
    - t: похож
      e: ["Он на тАту порАто нахОдит"]
- pom: [НаштО]
  rus:
    - t: зачем, для чего
      e: ["Мне дак он не наштО не нать", "НаштО ты мне нужОн?"]
- pom: [НаяновАтой]
  rus:
    - t: нахальный, напористый
      e: ["НаяновАтой пАрух-от у ей"]
- pom: [НебАвной]
  rus:
    - t: несоразмерный
      e: ["ОбУтка-то небАвна ко моЕй ногИ"]
- pom: [НевЕя]
  rus:
    - t: погибель, смерть
      e: ["На невЕю своЮ ты тудЫ похОдишь"]
- pom: [НевОзнатьи]
  rus:
    - t: без предупреждения, незванно-негаданно
      e: ["Я, бывАт, пришОл невОзнатьи?"]
- pom: [НеймА]
  rus:
    - t: не пойманный, трудно уловимый
      e: ["НовА-то утельгА така нЕйма, дак"]
- pom: [НЕкак]
  rus:
    - t: никак
    - t: Не могу
      e: ["НЕкак мне взЕть-то евО"]
- pom: [НекорЫссной]
  rus:
    - t: незавидный, плохой
      e: ["НекорЫссной женИх-от"]
- pom: [НелЕпо]
  rus:
    - t: неспокойно
      e: ["НелЕпо нАмори, пЫлко", "Мне нелЕпо нА серцци"]
- pom: [НемА]
  rus:
    - t: нет
      e: ["КваскУ немА, дак водЫ лиенИ!"]
- pom: [НенаЕда]
  rus:
    - t: пища, которой не насытиться
      e: ["КонфЕтки-то, бывАт, ненаЕда"]
- pom: [НЕриньги]
  rus:
    - t: прибрежные песчаные наносы, дюны
      e: ["О ПорАнихи тАма-ка – о Ягриньски нЕриньги"]
- pom: [НЕроботь]
  rus:
    - t: тунеядец
      e: ["НЕроботь ты огУрна – рОбить те лИхо!"]
- pom: [НЕрша]
  rus:
    - t: рыболовная снасть сплетеная из прутьев (вЕрша)
- pom: [НесОшной]
  rus:
    - t: не кормленный материнской грудью ребёнок
      e: ["НесОшна дЕфка-то у ей"]
      r: [сОшной]
- pom: [НестАркой]
  rus:
    - t: моложавый
      e: ["Она-то нестАрка ишшА жОнка"]
- pom: [НесЯк]
  rus:
    - t: нагромождение льдин на отмелях, образующееся в результате приливов и отливов
      r: [стамУха]
- pom: [НЕтиньё]
  rus:
    - t: верхняя, надземная часть растения
      e: ["У рЕпы-то нЕтиньё варИм"]
- pom: [НеурУцьё]
  rus:
    - t: неудобная для руки, несподручная вещь
      e: ["ОбжА-то у сохИ какО неурУцьё, дак"]
- pom: [НехтО]
  rus:
    - t: никого
      e: ["Мне, бывАт, нехтО не нать"]
- pom: [НешшАдно]
  rus:
    - t: беспощадно
      e: ["По спинЫ нешшАдно вЕником нахвОстал"]
- pom: [НИва]
  rus:
    - t: перекат в реке, порожек, быстрина на мелком месте
      e: ["О нИвы хАрьюза-то поимАл?"]
- pom: [НИлакса]
  rus:
    - t: длинная, узкая мель в море, опасная во время шторма
      e: ["О нИлаксы-то пружИт карбаскИ"]
- pom: [НИлас]
  rus:
    - t: первый тонкий лед на реках
    - t: ломаный лед, носимый ветрами и течениями в устьях рек поздней осенью.
- pom: [НОвиця]
  rus:
    - t: новолуние
      e: ["О нОвици-то навАга ко бЕрегу кАтит"]
    - t: прилив воды в новолуние
      r: [нОфцива]
- pom: [НовОй]
  rus:
    - t: иной, другой, некоторый
      e: ["НовОй и спасибо не скАжёт"]
- pom: [НовОйраз]
  rus:
    - t: иногда
      e: ["НовОйраз ранЁхонько спать повалИмссе"]
- pom: [НОфцива]
  rus:
    - t: большой морской прилив в новолуние
      e: ["МорЯна-то пАла на нОфциву"]
- pom: [НоговИця]
  rus:
    - t: портянка, опорка
      e: ["НоговИцю навертИт – дак дорОдно"]
- pom: [НОнцё]
  rus:
    - t: теперь, сейчас
      e: ["НОнцё я словА-то замАлтывал"]
- pom: [НорвЕга]
  rus:
    - t: Норвегия
      e: ["МезЕна да ОнЕга – МАтка да НорвЕга"]
    - t: топор с прямоугольным обухом, со скошенной в одну сторону заточкой лезвия
- pom: [НорИло]
  rus:
    - t: шест для проталкивания сетей под лёд
- pom: [НорИть]
  rus:
    - t: ловить рыбу в проруби
      e: ["НорИли навАжку о НикОлы зИмнёво"]
- pom: [Нос]
  rus:
    - t: большой утёс, мыс, полуостров далеко выдающийся в море
      e: ["ДвОи СветЫх НосОфф-от"]
- pom: [НОсник]
  rus:
    - t: речной лоцман
      r: [вож]
- pom: [НосЫря]
  rus:
    - t: любопытный
      e: ["НосЫря ты, наяновАтой!"]
- pom: [НохцЯ]
  rus:
    - t: место, где кормится стая перелётных водоплавающих птиц
      e: ["О сОгры-то гусИнна нохцЯ"]
- pom: [НоцимЁржа]
  rus:
    - t: мартовский тонкий и гибкий лед, образующийся ночами и тающий днем
      e: ["По ноцимЁр-жи на кАлгах бЕгали"]
      r: [кАлги]
- pom: [НОцесь]
  rus:
    - t: прошлой ночью
      e: ["НОцесь нудьЮ жгАли"]
      r: [нудьЯ]
- pom: [НудьЯ]
  rus:
    - t: костёр из нескольких чурбанов, положенных в один ряд друг над другом, с целью продолжительного горения
- pom: [НУрмы]
  rus:
    - t: оленьи пастбища
      e: ["ОлЕшка где-ка – дак Этта у зырЯн нУрмы"]
- pom: [НУтреной]
  rus:
    - t: внутренний
      e: ["НУтрены-то двЕри – котОры во Избы"]
- pom: [НЮка]
  rus:
    - t: тент
      e: ["НЮку какУ-ли роспЕлим, да сидИм всемА сОхнём"]
- pom: [НюрА]
  rus:
    - t: мель, образованная мягкими породами (ил, глина, песок), в которых глубоко увязает шест
      r: [нЯша]
- pom: [НЯша]
  rus:
    - t: грязь
    - t: топкий ил с гниющими водорослями в полосе прилива
