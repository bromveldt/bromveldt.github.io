- pom: [КОмель]
  rus:
    - t: основание ствола дерева
- pom: [Кон]
  rus:
    - t: начало
      e: ["С новОго кОну похОдим"]
- pom: [КОнАть]
  rus:
    - t: обращаться с просьбой, умолять, уговаривать
      e: ["За кАрбас хватАйссе, да Богу конАйссе", "Он конАлссе тАты: «Пусти мя во прОмысёл!»"]
- pom: [КондАць]
  rus:
    - t: боровой, строевой лес с твёрдой древесиной
