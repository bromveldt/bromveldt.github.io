      e: ["КогдЫссе ишшА было говОрено"]
- pom: [КОдола]
  rus:
    - t: толстая верёвка, канат
      r: [арестЕга, кабАлка]
- pom: [КОйе]
  rus:
    - t: в каком месте, где
      r: ["Ты кОйе лодку-то сосмекАл?"]
- pom: [КожАн]
  rus:
    - t: летучая мышь
      r: [лепАк]
- pom: [КожУх]
  rus:
    - t: выступ спереди над устьем у русской печи
      e: ["На кожУху полОжил"]
- pom: [КозанОк]
  rus:
    - t: сустав пальца
      e: ["Ко дожжУ-то козанкИ трешшАт"]
- pom: [КозновАтой]
  rus:
    - t: изворотливый, коварный
      e: ["КозновАтой мужицЁнко"]
- pom: [КозУля]
  rus:
    - t: фигурный рождественский пряник, печенье
