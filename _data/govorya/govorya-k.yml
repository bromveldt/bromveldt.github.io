- pom: [КлешшИть]
  rus:
    - t: цепляться
      e: ["Ты коемУ не клешшИсь"]
- pom: [КлешшИця]
  rus:
    - t: игла для вязания сетей
      c: [грЯнка]
    - t: зимняя удочка в виде лопатки с отверстием для лесы, на которую ловили навагу зимой
- pom: [КлубЫк, клобЫк]
  rus:
