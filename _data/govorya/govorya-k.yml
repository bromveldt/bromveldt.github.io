- pom: [КилА]
  rus:
    - t: символ срамоты
      a: Тому, кто последним убирал урожай (их называли «киловАна»), соседи вешали на забор или в сенях «килУ», сделанную из снопа скрученной соломы
    - t: опухоль на теле
      e: ["КилА – дИко мЯсо"]
- pom: [КилО]
  rus:
    - t: клин
      e: ["ЗакопЕрь-ко кильцЁ во топорИшшо"]
- pom: [КинАть]
  rus:
    - t: бросать
      e: ["Не кинАй калтАки в окОшко-то!"]
- pom: [КипАк]
  rus:
    - t: крутой, каменистый берег моря, о который разбиваются волны
      e: ["О пАхты-то кипАк пылИт"]
- pom: [КирьЯк]
  rus:
    - t: семга идущая в реки в конце лета
      e: ["КирьЯк – лоховАта рЫба, не порАто скуснА", "У кирьЯка крУпной клЁск"]
- pom: [КисА]
  rus:
    - t: "мешковидная сумка, которую носили на тесме через плечо: с кисОй в Рождество ходили собирать колядочные подарки. С кисОй ходили нищие"
- pom: [КисЕць]
  rus:
