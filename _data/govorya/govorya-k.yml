- pom: [КолмовАтой]
  rus:
    - t: всклокоченный, взъерошенный
      e: ["МАлиця-то худА, да колмовАта"]
- pom: [КолОдьё]
  rus:
    - t: завал топляков в реке
      r: [дор]
- pom: [КОлотьё]
  rus:
