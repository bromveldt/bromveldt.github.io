letter: К
entries:
- pom: [КАба]
  rus:
    - t: небольшой, толстый, вбиваемый в землю кол
      e: ["ЗацЯль да оприкОль лОдку на кАбу-то"]
- pom: [КАбала, кАбалка?]
  rus:
    - t: прядь из верёвки
      e: ["РИхама – тОнка кАбалка"]
      r: [рИхама, кОдола]
- pom: [КАбат]
  rus:
    - t: длинная, холщовая, грубая рабочая одежда с капюшоном, надеваемая через голову
      e: ["ПинежАна да мезЕна в кабаткАх"]
      r: [Юпа, совИк]
- pom: [КАжет]
  rus:
    - t: кажется
      e: ["Мне фсё цЕго-ли кАжёт да блАзицце. ЕмУ смешнО кАжет"]
      c: [кАжёт]
- pom: [КАжёт]
  rus:
    - t: показывает кому-то что-то
      e: ["Ты цегО Элако мне кАжёшь?", "ПлатОн да РомАн кАжут зИму нам"]
- pom: [КАжной]
  rus:
    - t: каждый
      e: ["КАжной год в мОрё ходИли"]
- pom: [КазАк]
  rus:
    - t: наёмный работник, батрак
    - t: бродяга
      a: '*казаковАть* – бродяжничать'
- pom: [КазацИха]
  rus:
    - t: молодая девушка, нанявшаяся в няньки за еду и кров, без прАзги (т.е. безденежной оплаты)
- pom: [Как]
  rus:
    - t: если
      e: ["Ты как найдешь евО, так крицИ громцЕ"]
- pom: [КалАйдать]
  rus:
    - t: колотить во что-либо, стучаться
      e: ["ЦЮю, калАйдат кто-то во ворОцця-то"]
- pom: [КАлги]
  rus:
    - t: широкие берёзовые лыжи, подбитые снизу шкурой с живота тюленя или нерпы
      e: ["По колтАцью на кАлгах бЕгали"]
- pom: [КапедИть]
  rus:
    - t: выпрашивать, клянчить
- pom: [КалИтка, колИтка]
  rus:
    - t: ватрушка овальной формы с крупяной, ягодной или картофельной начинкой
      a: В отличие от обычного хлеба калитка только черствеет, засыхает, но практически никогда не плесневеет
      r: [шАньга]
- pom: [КалтАк, колтАк]
  rus:
    - t: комок снега, «снежок»
      e: ["КолтакИ скорЕ лепИ, кинАцце бУдём", "КолтакОм-от волицЁ шАрнул"]
      c: [колдАк, колтАцьё]
- pom: [КальгА]
  rus:
    - t: сумма
    - t: итог подсчёта
      e: ["Во кальгУ ишшА должОк кладИ"]
      r: [прАзга]
- pom: [КАлья]
  rus:
    - t: лысина
      e: ["По кАльи-то те вот жАрну"]
- pom: [КАмасы]
  rus:
    - t: шкура, снятая в виде чулка с ног оленя или коровы
      e: ["Со кАмасья шЫли Уледи да кОйбенки"]
- pom: [КАменка]
  rus:
    - t: очаг из камней в бане
      c: [Алаш]
    - t: постройка из камней, для укрытия от ветра
      e: ["Во кальгУ ишшА должОк кладИ"]
- pom: [КанАбра]
  rus:
    - t: 'растение брусника (*брУска*)'
    - t: багульнично-брусничные места
      e: ["Во канАбры брУску брАли"]
- pom: [КАнуть]
  rus:
    - t: протекать
      e: ["Лодка не кАнёт, не лягУцця, да не опрУжлива – дак и дорОдно, бывАт"]
- pom: [Кань, кАня]
  rus:
    - t: хищная птица канюк
      e: ["КАня вОна лЁтат"]
- pom: [КАньги]
  rus:
    - t: кЕньги – меховые поморские сапоги с загнутыми кверху тупыми носками
      a: их шьют из «кАмасов» – шкуры, снятой с ног оленя мехом внутрь
- pom: [КАнька]
  rus:
    - t: длинный кол с ковшом на конце, которым достают воду из колодца
- pom: [КАра]
  rus:
    - t: 'деревянное подобие подноса, одна половина которого ниже другой. *КАра* используется для остужения на ней свежесваренной рыбы'
      a: горячая вода с рыбы стекает, и она быстрее остывает
    - t: разделочная доска
    - t: настил на дне лодки
- pom: [КАрдёх]
  rus:
    - t: камешки, попадающиеся в пищевой поваренной соли
    - t: мелкий сор, камешки, песок
      e: ["Не трусИ кардЁху-то нАпол!"]
- pom: [КАрды]
  rus:
    - t: чесалки для шерсти
      r: [цАпки]
- pom: [КАреньга]
  rus:
    - t: суковатый обрубок дерева, суковатая, «долгая» толстая кривая папка, сухое дерево на болоте
      e: ["Ко багрУ-то кАреньгу слАдил – дак и дорОдно"]
- pom: [КАрзать, кОрзать]
  rus:
    - t: обтёсывать, обрубать ветви
      e: ["ОкОрзал глАтко; фее оком Елоцьки поотЁсывал"]
- pom: [КармакУлы]
  rus:
    - t: рифы. «ТАйны кармакУлы» – подводные рифы. Они «мырЯт», т. е. над ними видна зыбь и буруны на поверхности воды. «СухИ кармакУлы» торчат из воды.
- pom: [КаршА]
  rus:
    - t: плывущее по воде или затонувшее с корнями и ветвями дерево
      e: ["КаршУ на брИвны вЫволоцило"]
- pom: [КАска]
  rus:
    - t: '*росчись* в лесу, небольшая лесная гарь'
- pom: [КАсьва]
  rus:
    - t: нарост на дереве
      e: ["КАсьву нать стесАть"]
- pom: [КАссь]
  rus:
    - t: гадость
    - t: распутица, грязь
      a: '*закАстил* – испачкал'
    - t: сырость, гадкая погода
      e: ["НаУлици-то порАто кАсько", "Элака кАссь на дорОги-то"]
- pom: [КАтицце]
  rus:
    - t: движется
    - t: плывет
      e: ["ЮрО рЫбьё сюдЫ кАтицце"]
- pom: [КАтанки, кАтанци]
  rus:
    - t: валенки
      e: ["КАтанци-то мокрЯшши скинывАй!"]
- pom: [КАтко]
  rus:
    - t: скользко
      e: ["ПорАто кАтко по мостОцькам-то иттИть"]
- pom: [КатрА]
  rus:
    - t: когтистая ласта морского зверя (тюленя, нерпы, моржа и т.д)
    - t: Чесалка для шерсти
      e: ["КАтрама шерссь цЁшут"]
      r: [цАпфы]
- pom: [КацЁра]
  rus:
    - t: дымная завеса во время лесных пожаров, гарь
      e: ["С кацЁры угАру-то надышАллсе"]
- pom: [КЕбрик]
  rus:
    - t: берестяной поплавок у сети
    - t: маленькая коробочка из бересты
      e: ["Во кЕбрике соль-от вОзьми"]
- pom: [КЕгора]
  rus:
    - t: ягельное место
      e: ["О кЕгора пасУцця олЕшка"]
- pom: [КЕда, кЕдовьё]
  rus:
    - t: большая луговина
      e: ["ХудО кЕдовьё"]
- pom: [КежА]
  rus:
    - t: мучной замес на воде для приготовления киселя
