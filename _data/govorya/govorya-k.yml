- pom: [КИсти]
  rus:
    - t: кладовые
      e: ["КИсти на подкИсьях жИром полнЁхоньки"]
      r: [жИро]
- pom: [КицИга]
  rus:
    - t: деревянная палка для катания белья
    - t: короткая изогнутая палка
      c: [кАреньга]
    - t: Созвездие Большой Медведицы и Полярной звезды
- pom: [КлАсць, клАсти]
  rus:
    - t: определять, назначать
      e: ["КладИ мя на-жИвоцьником, а евО – вЕсёльшшиком", "Был он клАден во нАшу-то дерЕвню"]
- pom: [КлёвИть]
  rus:
    - t: попрекать, дразнить
