- pom: [КнежИця]
  rus:
    - t: лесная ягода княженика
- pom: [КнЕссь, кнЕзёво, кнесЁк]
  rus:
    - t: бревно-гребень двускатной крыши, конёк крыши
- pom: [Кнесть]
  rus:
