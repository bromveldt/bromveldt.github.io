- pom: [КОкот]
  rus:
    - t: багор
      e: ["КОкот-от на дОлгой кАреньги с окомЕльём"]
- pom: [КОла]
  rus:
    - t: полярная звезда
    - t: отверстие в земле
      e: ["НовУ-то свАю не бей во прЕжню кОлу"]
- pom: [КОлбик]
  rus:
    - t: чурбан – нечто среднее между бревном и поленом
