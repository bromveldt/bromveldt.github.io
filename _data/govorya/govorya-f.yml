letter: Ф
entries:
- pom: [фиюсИт]
  rus:
  - t: (о ветре) усиливается, завывает
    e: [ "СИвёрко фиюсИт" ]
- pom: [флЯмовой]
  rus:
  - t: украшенный выпуклой резьбой, орнаментом и позолоченный иконостас, оклад иконы
    e: [ "СтАвень-от флЯмовой" ]
- pom: [фсаць]
  rus:
  - t: топкая, перенасыщенная водой почва
    e: [ "ТакА фсаць, ноги порАто вЁзнут в ей" ]
- pom: [фстОк]
  rus:
  - t: восточный ветер
    e: [ "ВОна фстОк зарубИл — по-ветЁрьё пАло" ]
  - t: расщепленная на конце палочка, в которую вставляют ложку для размешивания варева
- pom: [ФтОра]
  rus:
    - t: беда
      e: [ "ФтОра избо мЫтья боИцце" ]
- pom: [ФомбарА]
  rus:
    - t: бахрома у нижней поверхности гриба
      e: [ "У моховикА фомбарА-то жОлта" ]
      r: [ стОпка ]
- pom: [ФОршни]
  rus:
    - t: крепкие бечевки на тресковом ярусе, к которым привязывались крючки-уды
      e: [ "ФОршни нать не сорвалО" ]
      r: [ оростЕги ]
- pom: [ФуркотОк]
  rus:
    - t: урчание
      e: [ "СамовАр-от фУркат. У котЕйки ФуркотОк" ]
- pom: [ФцерАссь]
  rus:
    - t: вчера
      e: [ "ФцерАссь цямрА, да сЁднё цЯмра — дак и зАфтрема сУха не жди" ]
