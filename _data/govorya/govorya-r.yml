letter: Р
entries:
- pom: [РАбаць]
  rus:
  - t: кривоствольное, низкорослое дерево
    e: [ "На варАки тАма-ка рАбаць, жарОвых-то лесИн немА" ]
- pom: [РАва, рАвило]
  rus:
  - t: труп животного
  - t: Окровавленая туша зверя без шкуры
    e: [ "ЗвЕря-то оснимАшь, дак рАва рудИт" ]
    c: [ рОва ]
- pom: [РАвга]
  rus:
  - t: волдырь
    e: [ "РАвгу-то сЕрка лисвЯжна вытегАт", "ЕлОвой сЕркой рАвги-то лЕцят" ]
    c: [ желвь, бугИрь, килА, Урас ]
- pom: [РАда]
  rus:
  - t: травяное болото, поросшее редким засыхающим сосняком
    e: [ "О цЁрной рАды лосЯ стрелИл" ]
- pom: [РаЁк]
  rus:
    - t: угор с хвойным лесом посреди топкого болота
      e: [ "РаЁк – сухО мЕсто" ]
- pom: [РазженИть]
  rus:
    - t: разъединить, растащить в стороны
      e: [ "РазженИть нать льдИньё-то" ]
- pom: [РазвОдьё]
  rus:
    - t: свободная вода в море среди льдов
      e: [ "В развОдье рАншшину затЕрло" ]
- pom: [РазлОга]
  rus:
    - t: овраг или разрушающийся берег реки
      e: [ "Дом-от вЕснусь в разлОгу свЕрзилссе" ]
- pom: [РазоболокАть]
  rus:
    - t: раздевать
      e: [ "РазоболокАйссе, скинывАй скорЕ мокрЯшшу-то обУфку" ]
- pom: [РайдА, рАда]
  rus:
    - t: заросший ивой возвышенный участок на болоте
      e: [ "На рАды вЕрбы-то наломАла" ]
- pom: [РАмена]
  rus:
    - t: плечи
      e: [ "РАмена-от се пЕхтёрем натЁр" ]
- pom: [РАменье]
  rus:
    - t: очень густой, непроходимый, темнохвойный еловый лес
      e: [ "РАменье такО ТЕМНО" ]
      r: [кОрбы]
- pom: [РаностАй]
  rus:
    - t: тот, кто рано встаёт
      e: [ "ОнА рАно жИть-от поцинАт – такА раностАйка" ]
- pom: [РАньшина]
  rus:
    - t: поморское одномачтовое парусное судно, способное раньше других судов выйти на весенний промысел, благодаря особому устройству корпуса
      e: [ "РАньшины бЫли с однОй мАцьтой" ]
- pom: [РаспалИцце]
  rus:
    - t: очистится ото льда
      e: [ "Осемь дЁн ждАпи покУда мОрё распалИцце" ]
- pom: [РаспетУшьё]
  rus:
    - t: гермофродит
- pom: [РАхлиця, рАха]
  rus:
    - t: пирог с ячменной кашей и растолчёной морошкой
      e: [ "РАхлиця с пОдугорЯця, мАслицём волОжена" ]
- pom: [РЕгот, рЁгот]
  rus:
    - t: недобрый хохот
      e: [ "ЛЕшой у тя рЁгот-от" ]
- pom: [РедкИ]
  rus:
    - t: повторяющиеся узоры на расписных прялках
      e: [ "На прЯлоцьки редкИ с конЯма" ]
- pom: [РЕлка, рЁлка, рель]
  rus:
    - t: сухая узкая невысокая гряда на болоте
      c: [ раек ]
- pom: [Ремь]
  rus:
    - t: завывание ветра при шторме
      e: [ "Ремь вОёт, мОрё пылИт" ]
- pom: [РемзА]
  rus:
    - t: растение таволга
      e: [ "Этта тАволгу рЕмзой зовУт" ]
- pom: [РемкИ]
  rus:
    - t: лохмотья
      e: [ "ХОдит во ремкАх, обремкАлссе" ]
- pom: [РЕмьё]
  rus:
    - t: вьюга с вихрями
      e: [ "РЕмьё зарЯдило" ]
      r: [ хИвус ]
- pom: [РепакА]
  rus:
    - t: месячные
- pom: [РескА]
  rus:
    - t: тонкие лепёшки, испечённые на горячих камнях
      e: [ "РескА-то, бывАт, ненаЕда" ]
- pom: [РЕтёзь]
  rus:
    - t: металлическая цепь
      e: [ "ВьЮха-то с рЕтёзи.", "На рЕтёзи лОдка" ]
- pom: [РЕхацце, рЁхацце]
  rus:
    - t: тщательно и долго собираться, готовиться к чему-либо, мешкать, медлить, тянуть время, копаться долго и т. д.
      e: [ "ЦегО Элако дОлго рЕхаишьссе?" ]
- pom: [РЕшка]
  rus:
    - t: шрам
      e: [ "У евО устАвно бЫло ФЕдька-РЕшка" ]
      r: [ устАвно ]
- pom: [РЁвкнуть, рЁфкнуть]
  rus:
    - t: взреветь (о звере), рявкнуть
      e: [ "МедвЁть рЕфкат" ]
- pom: [РедИнны]
  rus:
    - t: домотканные
      e: [ "РубАхи да штанЫ у их редИнны" ]
- pom: [РЁхнуть]
  rus:
    - t: сильно тряхнуть
      e: [ "РЁхнул Ошкуй серкА" ]
- pom: [РИпка]
  rus:
    - t: тряпка, половик
      e: [ "РИпкой-то опашИ столЕшню", "НОги о рИпку оботрИ" ]
- pom: [РИхама]
  rus:
    - t: тонкая натянутая веревка-сторожок, привязанная к полотну сети
      e: [ "СЁмга в сеть удАрит, дак рИхама новОйраз гудИт" ]
      c: [ тЯцива ]
- pom: [РОбить]
  rus:
    - t: работать
      e: [ "Долго-ль ишшО рОбить-то?", "Мы цЕлой упрЯг рОбили" ]
- pom: [РобЯты]
  rus:
    - t: ребята
      e: [ "ПодИте-ко робЯты на Улицы игрАть" ]
- pom: [РОва]
  rus:
    - t: шкура
      e: [ "ЗИмусь-то мы спАли под медвЕжьёй рОвой" ]
- pom: [РОвга]
  rus:
    - t: пот
      e: [ "В бАйны рОвгу гОнит", "На спинЫ рОвгу вЫгнало, мокрЯшша спинА-то" ]
- pom: [РОвда]
  rus:
    - t: мерзлота под мхом на болотах и в тундре
      e: [ "ПОдина тАёт – дак рОвду с землИ гОнит" ]
    - t: При оттаивании рОвды весной (май-июнь) в болотах заметно повышается уровень воды, и тогда говорят «рОвда игрАт».
      e: [ "РОвда фсЮду игрАт" ]
- pom: [РОвня]
  rus:
    - t: равный
      e: [ "Ён мне не рОвня" ]
- pom: [РОвця]
  rus:
    - t: связанные вместе три-четыре сети
      e: [ "РОфцёй бурлАки рЕку перекрЫли" ]
      r: [бурлАки]
- pom: [РодонИця]
  rus:
    - t: на первой неделе после Пасхи, день поминовения родителей
      e: [ "На родонИцю-то на жАльницёк сброжУ" ]
- pom: [РОжонь]
  rus:
    - t: ивовый шампур для жарения на огне рыбы или мяса
      e: [ "РОжоньё-то настругАй" ]
- pom: [РОзвал]
  rus:
    - t: расширение, раструб
      e: [ "В рОзвал, бывАт, ловцЕ вОду-то лить" ]
- pom: [РОзвальни]
  rus:
    - t: деревянные конные сани
- pom: [РОзлито]
  rus:
    - t: разлито
      e: [ "ПИво во брАтины рОзлито" ]
- pom: [РОзно]
  rus:
    - t: рваное, дырявое
      e: [ "РубАха-то порАто рОзна" ]
- pom: [РОмша]
  rus:
    - t: небольшая артель морских промышленников, состоящая из четырех карбасов
      e: [ "РубАха-то порАто рОзна" ]
      r: [ скЕя, котлЯна, бУрса ]
- pom: [РонИть]
  rus:
    - t: ронять
      e: [ "«РОнит дАвнее, как листья в гать.» (Клюев)" ]
    - t: ВалИть лес
      e: [ "На Изьбу лес ронИли омАйско" ]
- pom: [РОпак, ропАк, рОпос]
  rus:
    - t: вертикально стоящая льдина, нагромождение льда
      e: [ "РОпосы-то какИ велИки", "БелЁк-от полЕз под ропАк" ]
      c: [ торОс ]
- pom: [РослЯк]
  rus:
    - t: древесина молодой сосны
      e: [ "РослЯк-от мендАцьной лес" ]
      r: [ мендАцьной ]
- pom: [РОсна]
  rus:
    - t: наветренняя сторона
      e: [ "ТОркнул вЕтёр-от да с рОсной сторонЫ" ]
- pom: [РосОл]
  rus:
    - t: морская вода
      e: [ "О МУдьюг-от ужЕ росОл ЖИВЁТ" ]
- pom: [РоспЕлить]
  rus:
    - t: растянуть
      e: [ "СеркА оснимАли, шкУру роспЕли-ли" ]
- pom: [РоспетАть]
  rus:
    - t: разобрать на части
      e: [ "РоспетАли нАшу-то цЕрькву, да в АрхАнгельско свезлИ" ]
- pom: [РостЕга]
  rus:
    - t: гребля вёслами с растяжкой, плавно, медленно
      e: [ "ГребИ с ростЕгой, не дЁргай" ]
- pom: [РОстить]
  rus:
    - t: выращивать
      e: [ "Мы-от жИта не рОстим" ]
- pom: [РОшеньга]
  rus:
    - t: гребень для расчесывания льна
      e: [ "РОшеньги прЕже бЫли – лён цИсали" ]
- pom: [РОшша]
  rus:
    - t: сладковатая мука из пророщенного жита
      e: [ "С рОшши-то слАдки козУли пеклИ" ]
- pom: [РохлЕць]
  rus:
    - t: незрелая ягода морошки
      e: [ "РохлЕць в кАшу мешАм" ]
      c: [ тестЯнка, цЁваль ]
- pom: [РОця]
  rus:
    - t: лесная лачуга, спрятанная от посторонних глаз
      e: [ "РОця не бАска, да тЁпла" ]
      r: [ кушнЯ ]
- pom: [РубЕць]
  rus:
    - t: место, где стыкуются два течения
      e: [ "По рубцЮ льдИну вЕртит" ]
- pom: [РУда]
  rus:
    - t: кровь
      e: [ "ЗвЕря оснимАшь – дак рУдной ЛЁД", "На прОмысле-то как не зарудИцце?" ]
- pom: [РУдна]
  rus:
    - t: о помещении, которое отапливается очагом без дымохода
      e: [ "РУдна бАенка" ]
- pom: [РудомЁтка]
  rus:
    - t: растение тысячелистник
      e: [ "РудомЁтка-то рУду останАвливат" ]
- pom: [РУжня]
  rus:
    - t: морда зверя
      e: [ "РУжня зверИна" ]
- pom: [РУженьё]
  rus:
    - t: облик, наружность
      e: [ "РУженьём-то не баскОй" ]
- pom: [РУить]
  rus:
    - t: чистить рыбу
      e: [ "РУить порАто лИхо", "ПодЁм-ко порУим сЁмгу" ]
      r: [ цередИть, оснимАть ]
- pom: [РунтА, рунтОфка]
  rus:
    - t: вяленая треска
      e: [ "РунтОфка-то вОна – на пАлтухах вЕснёт, вЕтрицце" ]
- pom: [РУшник]
  rus:
    - t: полотенце для вытирания рук
      e: [ "РушницЁк-от какО баскО" ]
- pom: [РЫмпель]
  rus:
    - t: мелкоячеистая сеть для невода
      e: [ "ПоездОк-от рЫмпельной" ]
- pom: [РЫндать]
  rus:
    - t: запинаться, спотыкаться, вязнуть
      e: [ "Конь-от во тУнтуры рЫндат, а олЕшка быстрЁхонько бежАт", "ПОрушни-то ширОки, дак не рЫндашь в болОте-то" ]
      r: [ ПОрушни ]
- pom: [РЫнцера]
  rus:
    - t: развОдье, открытая полоса воды между берегом и прибрежным льдом
      e: [ "О рЫнцеры нЁрпа на льдИны" ]
- pom: [Рыть]
  rus:
    - t: бросать
      e: [ "Рой жИро в вОду!", "НарЫло мОрё лапугИ да кАрши" ]
- pom: [РыцЯть]
  rus:
    - t: грозно кричать
      e: [ "Ты поштО рыцИшь-то?" ]
- pom: [РЯвця, рЯвча]
  rus:
    - t: рыба (беломорский бычок), которая по поверью может реветь. Сушеную рЯвцю клали под постель, так как считали, что она вытягивает из человека болезни
- pom: [РЯнда]
  rus:
    - t: осенняя погода с затяжными дождями
      e: [ "В сентябрЕ-то рЯнда падЁт" ]
      r: [ цЯмра ]
