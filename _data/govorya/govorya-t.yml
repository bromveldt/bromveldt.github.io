- pom: [ТЕЛгас]
  rus:
    - t: настил в лодке
- pom: [ТЕмёнь]
  rus:
    - t: темнота, темно
      e: [ "ТЕмёнь какА!" ]
- pom: [ТепЕриця, топЕриця, топЕре]
  rus:
    - t: теперь
      e: [ "ТопЕриця спать повалИмссе" ]
      r: [ нОныдё ]
- pom: [ТерЕть]
  rus:
    - t: стирать
      e: [ "ПойдУ плАтиньё терЕть" ]
- pom: [ТЕрпнуть]
  rus:
    - t: терять чувствительность
      e: [ "НогА тЕрпнёт, рукА отЕрпла" ]
- pom: [ТестЯнка, цистЯнка]
  rus:
    - t: спелая, янтарно-желтая мягкая ягода морошки
      r: [ рохлЕць ]
- pom: [ТЕтифка]
  rus:
    - t: привод самопрялки
- pom: [ТешкО]
  rus:
    - t: брюхо, живот
      e: [ "РЫбьё тЕшко белЕт" ]
- pom: [ТихА]
  rus:
    - t: тихая погода
      e: [ "ТакА тихА пАла" ]
- pom: [ТипАха]
  rus:
    - t: суконаая, или сшитая из нерпичьей шкуры черная демисезонная шапочка, напоминающая невысокую папаху, но с загнутым высоким околышем
      e: [ "ТорОк падЁт дак типАху одЁрживай" ]
- pom: [срЯду]
  rus:
    - t: xx
      e: [ "ДШ — Ш -то кАжет срЯду - дак истовЁнно баскА пАва" ]
- pom: [СсЫпцина]
  rus:
    - t: изготовление общинного пива
      e: [ "В ссЫпцину ко нашОй-то рОмши ПОЙДЁШЬ?" ]
      r: [ рОмша ]
- pom: [СтАдо]
  rus:
    - t: скопление птиц
      e: [ "СтАдо гУсей", "ЛебЯжьё стАдо", "Этта Уток стАдо сЕло" ]
    - t: Стая волков
      e: [ "Волкоф набежАло цЕло стАдо" ]
      c: [ стАя ]
- pom: [ТипушИ]
  rus:
    - t: вершинки, верхушки, крона
      e: [ "У прЯлоцьки-то дОлги типушИ" ]
    - t: ТипушА – венец, корона
      e: [ "У цярЯ-то типушА златА" ]
- pom: [Тлиль]
  rus:
    - t: выгоревший торфяник
      e: [ "Не ступИ во тлИль-то" ]
- pom: [ТобуркА]
  rus:
    - t: меховые сапоги, сшитые мехом внутрь, надеваемые, как правило, поверх другой меховой обуви
      e: [ "ТобуркА да бахИлы надЕваны на мехо-вЫ липтЫ" ]
      c: [ ярЫ, Уледи ]
- pom: [ТодОня]
  rus:
    - t: тонкопрядная нить
      e: [ "НИтку-то прЕжэ дЕфки тодОнили" ]
- pom: [Toe]
  rus:
    - t: той
      e: [ "О тОе жОнки порАто хорошО скАзывали" ]
- pom: [ТоймокАры]
  rus:
    - t: жители села Тоймы на Северной Двине
      e: [ "ОпрУжило тых тоймокАрофф на кармакУлах" ]
      r: [ тых ]
- pom: [Толк]
  rus:
    - t: согласие, взаимопонимание
      e: [ "Нать нам Фсе-мА, сУёмой толк-от дёржАть" ]
- pom: [ТонЯ]
  rus:
    - t: рыболовный участок для ловли ставным нЁводом или другими снастями
    - t: Избушка при рыболовном участке
    - t: Улов за один просмотр сети
- pom: [ТоплЯк]
  rus:
    - t: затонувшее бревно
      e: [ "ТоплЯк-от во дОньё тОркат" ]
- pom: [ТопурОк]
  rus:
    - t: деревянный поплавок, привязываемый на веревке к шесту, используется для протягивания сети из проруби в прорубь при подледном лове
- pom: [тОрбать*]
  rus:
    - t: загонять рыбу или белух в сети ударами шестов по воде
      e: [ "БелУху-то нать загонИть – дак тОрбали" ]
- pom: [ТОркнуть*]
  rus:
    - t: тыкать, толкать, пехать, колоть
      e: [ "ТОркни-ко носкОм во лУзьё" ]
    - t: Отталкиваться шестом от дна, стоя в лодке
- pom: [ТорОк]
  rus:
    - t: мощный шквал ветра
      e: [ "ТорОк падЁт, дак нать кАрбас не опрУжило" ]
    - t: Шквал ветра, который предшествует грозе
- pom: [ТорОс]
  rus:
    - t: место столкновения ледяных полей
      e: [ "НАмори торОс да рОпасы" ]
      c: [ "ропакИ" ]
- pom: [ТОснуть]
  rus:
    - t: тосковать
      e: [ "Я на торОс хОжал – по матЁры не тОснул" ]
- pom: [ТОттамдень]
  rus:
    - t: несколько дней назад
      e: [ "ТОттамдень ходИли мы на ВЫгозеро" ]
- pom: [ТОттамраз]
  rus:
    - t: в позапрошлый раз
      e: [ "ТОттамраз мы не Этта бЫли" ]
- pom: [ТОшно]
  rus:
    - t: тяжело на душе
      e: [ "ТОшно сЁрыдцю моЁму" ]
- pom: [ТравницЁк]
  rus:
    - t: мелкая щучка, щурёнок
      e: [ "Во кУрьи-то спроЁм трАвницькофф" ]
- pom: [ТрескоЕда]
  rus:
    - t: шутливое название архангелогородцев
- pom: [ТрестА]
  rus:
    - t: тростник
    - t: Солома
      e: [ "ТрестЫ-то во стАйки натрУшь" ]
- pom: [ТретьегОдни]
  rus:
    - t: позавчера
      e: [ "ТретьегОдни лед на рекИ снёслО" ]
- pom: [ТрОпнуть]
  rus:
    - t: ударить сверху вниз
      e: [ "МедвЁть-от лАпой егО трОпнул" ]
    - t: Внезапно начаться и закончиться
      e: [ "ДОжжик манЕнько трОпнул" ]
- pom: [ТрУшить]
  rus:
    - t: сыпать
      e: [ "НатрУшь-ко сЕна скотИны" ]
- pom: [ТрУшницять]
  rus:
    - t: собирать по дорогам выпавшее с возов сено, зерно и т.д.
      e: [ "Я-то, быват, навекУ не трУшницял" ]
- pom: [ТузлУк]
  rus:
    - t: соляной раствор для засолки рыбы
- pom: [Тук]
  rus:
    - t: топленый жир морского зверя
- pom: [ТулОмь]
  rus:
    - t: порожистое место на реке, каменный завал на перекате, запруда
      e: [ "О тулбмы-то нать не опрУжило" ]
- pom: [ТУнтура]
  rus:
    - t: тундра
      e: [ "По тУнтуры на олЕшках Ехали" ]
- pom: [ТурА]
  rus:
    - t: ламинария, бурая морская водоросль с «пузырьками», называемая еще морской капустой
      e: [ "НахАрвы спроЁм турЫ-то" ]
- pom: [ТурАцька]
  rus:
    - t: катушка для ниток
