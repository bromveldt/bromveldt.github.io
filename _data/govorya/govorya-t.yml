- pom: [Тых]
  rus:
    - t: тех
      e: [ "У тых робЯт-от тАты немА" ]
- pom: [ТЫшкат]
  rus:
    - t: затухает, дымит, плохо топится
      e: [ "ПЕцька тЫшкат" ]
- pom: [Тя]
  rus:
    - t: тебя
- pom: [ТЯги]
  rus:
    - t: петли у ворот
      e: [ "ТЯги желЕзны" ]
- pom: [ТяглЕць]
  rus:
    - t: помощник кормщика при вытягивании ярусной снасти
- pom: [ТЯцёва]
  rus:
    - t: веревка невода
      e: [ "Тени-ко пУшше за тЯцёву-то" ]
      c: [ рИхама ]
