  - t: незамерзающее озеро, в котором много родников
    e: [ "ТАма-ка зИмусь мы стАльникофф вОду цЁрпали" ]
- pom: [ТальЯ]
  rus:
    - t: щит из прутьев и вИцья, которым перегораживают реку при ловле сёмги
      e: [ "НОнце тальИ нестАвят" ]
- pom: [ТАрьё]
