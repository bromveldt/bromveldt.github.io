    - t: отец, папа
      e: [ "МоИ-то тАта да мАмо – кулоЯна" ]
- pom: [Тать]
  rus:
    - t: преступник, вор
      e: [ "От тАтей амбАры" ]
- pom: [ТАшка]
  rus:
    - t: связка
      e: [ "ВеникОффтАшку во бАйныприташшИ" ]
- pom: [Те]
  rus:
    - t: тебе
- pom: [ТевЯк]
  rus:
    - t: гренландский тюлень
