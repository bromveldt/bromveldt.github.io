- pom: [ТухтЫрь]
  rus:
    - t: плетеный из бересты сосуд с горлышком, затыкающимся пробкой, который используется для хранения сыпучих продуктов
- pom: [ТЫло]
  rus:
    - t: затылок
      e: [ "ТрОпну вот те в тЫло-то" ]
