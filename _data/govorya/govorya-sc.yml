letter: У
entries:
- pom: [ШаборцЯть]
  rus:
  - t: шуршать, журчать, тихо шуметь
    e: [ "СамовАр-от шаборцИт — подИ цяй пить" ]
- pom: [ШАгла]
  rus:
  - t: жаберная крышка у рыбы
    e: [ "ШАглы да скорыньЁ рыбьЁ остАлиссе" ]
    c: шАлга
- pom: [ШАдра]
  rus:
  - t: моржовый клык
    e: ["ШАдры моржОвы бЕлы"]
- pom: [ШАить]
  rus:
  - t: тлеть
    e: [ "ДрОвци-то водопЕлы, в пЕцьки шАют" ]
- pom: [ШАлга]
  rus:
    - t: лесная вырубка
      e: [ "На шАлги корзИну-то остАвила" ]
- pom: [ШАньга]
  rus:
    - t: лепешка из пресного теста на воде или молоке, смазанная маслом. На раскатанное кружком тесто накладывают творог, сметану, ягоды, кашу и т.д.; «тЯпаны» шаньги готовят на прокисшем «свЕжом» молоке
      e: ["ШАньги-то тЯпаны свЕжим молокОм"]
      r: [ свЕжо молокО ]
- pom: [ШапнЯ]
  rus:
    - t: вода, выступающая из подо льда
      r: [ кОгва, кОлва, лУмда, зАберег ]
- pom: [ШАрицце]
  rus:
    - t: копошиться, долго возиться с чем-либо, долго собираться
      e: [ "ДокУда ишшА бУдёшь шАрицце-то?" ]
- pom: [шар]
  rus:
    - t: "морской пролив, как правило, между берегом и островами: МАтоцькин шар, ЮгОрьской шар и т. д."
      e: [ "За ЮгОрьской шар ход на Матку" ]
- pom: [ШарЕй, шареЯ]
  rus:
    - t: быстро движущийся туман
      e: ["ШарЕй лУду зАстил"]
      r: [ байгА, цямрА ]
- pom: [ШаркунОк]
  rus:
    - t: особая детская погремушка, состоящая из множества деревянных деталей
      e: ["ШаркункАма-то прЕжэ робЯта игрАли"]
- pom: [ШаромЫга]
  rus:
    - t: большая, с полпальца длиной, летняя мормышка для ловли в реке на ПОДДЁВ
      e: ["НашаромЫгу шшук надЁргал"]
- pom: [ШастА]
  rus:
    - t: белый олений мох
      e: ["На Едо мы спроЁм шастЫ"]
      r: [ Едома ]
- pom: [ШЕйма]
  rus:
    - t: якорная веревка, цепь
      e: ["ДрЕк за шЕйму вЫзнели"]
- pom: [ШЕлега]
  rus:
    - t: тюленье сало
      e: ["Этта в бОцьки-тошЕлега"]
- pom: [ШелОнник]
  rus:
    - t: юго-западный ветер на Белом море
      e: ["У шелОнника жОнка баскА – он на обнОцьё к ей спать ухОдит"]
- pom: [ШЕпетко]
  rus:
    - t: плотно, тесно
      e: ["ШЕпетко селётки в цердакАх"]
- pom: [ШипИця]
  rus:
    - t: шиповник
      e: ["Этта шипИцьной Остроф"]
- pom: [ШИпша]
  rus:
    - t: липкий, мокрый снег
      r: [ нАлепь, юхлА, обнУтка ]
- pom: [Шиш]
  rus:
    - t: жулик
      e: ["ШишевАть-то не обУцены"]
    - t: Мелкий бес
      e: [ "Шиш вЫшку шОркат", "ШишАнёй ей в дерЕвни звАли" ]
- pom: [ШкатОрина]
  rus:
    - t: веревка, которой для прочности обшивают кромку паруса
- pom: [ШквОрёнь]
  rus:
    - t: металлический длинный прут, гвоздь
      e: [ "За шквОрить двоитЁс — «забить гвоздь»", "ШквОрнём креп Или перОу кАрбаса" ]
- pom: [ШкЕрить]
  rus:
    - t: разделывать рыбу
      r: [ цередИть ]
- pom: [ШКуль]
  rus:
    - t: запас
      e: [ "У сорОки тАма-ка шкУль запрЕтана" ]
- pom: [ШлЯнда]
  rus:
    - t: бродяга
      e: [ "ШлЯнда-то где-кашлЯндат?" ]
- pom: [ШнЕка, шнЯка]
  rus:
    - t: большая беспалубная парусно-весельная лодка с прямым парусом и тремя парами весел с командой из четырех человек
      e: [ "ПрЕжэ на Мурмане шнЯки бЫли" ]
- pom: [ШОлнцё]
  rus:
    - t: солнце
      e: [ "ЦямрА шОлнцё зАстит" ]
- pom: [ШОлныш]
  rus:
    - t: место перед русской печью, где стряпает хозяйка
- pom: [ШолОп]
  rus:
    - t: карстовая трещина в земле
      e: [ "О шолОпы-то малИны спроЕм" ]
- pom: [ШолывАн]
  rus:
    - t: пересмешник
      e: [ "ШолывАн-то смехОм зОвёт" ]
- pom: [ШОшка]
  rus:
    - t: колышек для крепления лодочной мягкой крыши-*буйнА* (из шкуры или из сукна), которую натягивали над лодкой поморы
      e: [ "Под буйнО-то полезАй" ]
- pom: [Што]
  rus:
    - t: что
      e: [ "Што Элако свЕтит?" ]
- pom: [ШугА]
  rus:
    - t: лед плавающий в реке до ледостава осенью
- pom: [ШУиця]
  rus:
    - t: левая рука
      e: [ "ШУиця-то уе гОлофцЕ" ]
- pom: [ШулихОн, шулюхОн, шалихОн, шишликОн и т.д.]
  rus:
    - t: святочный ряженый, печной черт
- pom: [ШУстать]
  rus:
    - t: шнырять, шастать
      e: [ "Нать в пОдполу кот-от шУстат" ]
- pom: [ШыпОта]
  rus:
    - t: зуд, жжение кожи
      e: [ "С мАслишша морьскОго — шыпОта" ]
- pom: [ШЕльё]
  rus:
    - t: высокий отвесный берег реки
      e: [ "На шЕльи-то водА навекУ не ЖИВЁТ" ]
- pom: [ШИпець]
  rus:
    - t: шест с расщепленным на три части острием, применяющийся для захватывания раковин жемчужниц со дна реки
      r: [ водоглЯд ]
- pom: [ШОша, шОшка]
  rus:
    - t: колышек для крепления крыши-*буйнА* на зверобойной лодке
      r: [ буйнО ]
- pom: [ШУйка]
  rus:
    - t: игла для плетения сетей
- pom: [ШшУр]
  rus:
    - t: дождевой червь
