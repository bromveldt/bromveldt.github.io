letter: С
entries:
- pom: [СажЕнь]
  rus:
  - t: мера длины около 2,134 метра
- pom: [СайдА]
  rus:
  - t: вид тресковых рыб в Белом и Баренцевом морях
    e: [ "СайдА мЕньше трескИ" ]
- pom: [САлбас]
  rus:
  - t: теплая накидка на стАвень (крышку люка) в погребе
    e: [ "ПоштО ты стАвень-то сАлбасом не укУтал?" ]
  - t: Занавесь, полог, рогожа для занавешивания дверей зимой
    e: [ "МорОзливо дак глУхо сАлбасом ворОцця кУташь" ]
- pom: [САлмы]
  rus:
  - t: проливы между матЁрой и островами в Белом море
    e: [ "Во сАлму-то правь кАрбас" ]
    c: [ шар ]
- pom: [САло, сУло]
  rus:
    - t: осенний рыхлый, рассыпчатый лёд, образующийся в устьях рек, впадающих в море
      e: [ "САло на рекИ – скОро лед стАнёт" ]
- pom: [САнник]
