      e: [ "В полагУшки-то молокО свЕжо – дак не пей" ]
- pom: [СверЁжой]
  rus:
    - t: бойкий, решительный, расторопный
      e: [ "МолодОй – да сверЁжой" ]
- pom: [СвётЕць]
  rus:
    - t: металлическая подставка с развилкой, в которую вставлялась горящая лучина, а обгоревшие остатки лучины падали в стоящий под ней поддОн с водой
- pom: [СвётОк]
  rus:
    - t: самое начало рассвета
