letter: М
entries:
- pom: [МАйна]
  rus:
    - t: полынья, трещина во льду, прорубь
      e: ["Во мАйну-то не свЕрзнись!"]
- pom: [МАйтова]
  rus:
    - t: минерализованная вода, которая при кипячении белеет, из-за выпадающих в ней хлопьев известняка
      e: ["Во ЦЮги-то, во рекИ водА мАйтова"]
- pom: [МАкса]
  rus:
    - t: печень рыбы
      e: ["ТрескОва-то мАкса сАма скУсна"]
      r: [вОюкса]
- pom: [МАлиця]
  rus:
    - t: одежда из шкуры оленя, надеваемая через голову шерстью внутрь, с капюшоном и рукавицами, пришитыми к рукавам
      e: ["ПрЕжэ-то фее мезЕна в мАлицях да совикАх ходИли"]
      r: [совИк]
- pom: [МАлтать]
  rus:
    - t: понимать
      e: ["мАлташь, нет?"]
      r: [омАлтацце]
- pom: [МангА]
  rus:
    - t: источник ключевой воды в озере, над которым образуется непрочный лед
      e: ["МангА-то – дак тОнкой лёд над ей"]
- pom: [МанЕнько, малЕнько]
  rus:
    - t: немножко
      e: ["ЛиенИ-ко вараткУ манЕнько"]
      r: [варАток]
- pom: [МанИха]
  rus:
    - t: временное, обманчивое прекращение морского прилива, когда вода останавливается или даже убывает, а затем вновь идёт на прибыль
- pom: [МАслишшё]
  rus:
    - t: медуза
      e: ["МАслишшо берЕжит – дак жди лОсо нАмори"]
- pom: [МАтенка]
  rus:
    - t: матушка
      e: ["МАтенка у тя где, дЕфка?"]
- pom: [МАтёра]
  rus:
    - t: материк
    - t: ветер с материка
      e: ["МатЁра пАла"]
- pom: [МатЁра ВОда]
  rus:
    - t: самый высокий уровень воды
      e: ["МатЁра вОда зарубИла", "ЛУду-то матЁрой снелО"]
      r: [лУда, снелО]
- pom: [МАтиця]
  rus:
    - t: часть невода в виде мешка, откуда достают рыбу
      e: ["МАтицю развежИ"]
    - t: брус под потолком, на который кладут потолочные доски
- pom: [МАтка]
  rus:
    - t: архипелаг Новая Земля
    - t: поморский компас
      e: ["СтАры мАтки, скАзывают, бЫли ветромЁты"]
- pom: [МахАфка]
  rus:
    - t: кусок ткани на шесте или на мачте
    - t: помело, привязанное к шесту
      e: ["С прОмысла-то шли -ко мАцьты вЕсили краснУ махАфку"]
- pom: [МАхонной]
  rus:
    - t: маленький
      e: ["Она, быват, мАхонна ишшО"]
- pom: [МЕжень]
  rus:
    - t: 'средний летний уровень воды в реке, нарушаемый половодьем, *морЯной* или *дожжАма*'
      e: ["На мЕжени осИнофка в реки не мелИцце"]
      r: [осИнофка, мЕлицце]
- pom: [МЕзьё]
  rus:
    - t: речные излучины
      e: ["По мЕзью-то дОлгой путь"]
- pom: [МЕнёк]
  rus:
    - t: налим
      e: ["МенькОфф-от шЕпетко в сЕтки напехАлоссе"]
      r: [шЕпетко]
- pom: [МЕнь, немь]
  rus:
    - t: речной мыс
      e: ["КотОры скАжут ЦИгломень, котОры – ЦИглонемь"]
- pom: [МЕсто]
  rus:
    - t: перина
      e: ["Днем-от на мЕсто не садИсь – заругАют хозЯва"]
- pom: [МЕтик]
  rus:
    - t: мелкий, смешанный елово-сосновый лес, непригодный для лесоповала
- pom: [МЕтить]
  rus:
    - t: целиться
      e: ["Он в ей лУком мЕтит"]
- pom: [МЕцишшё]
  rus:
    - t: девичье летнее гулянье-смотрины
      a: Устраивалось после того, как сметают сено в стога
      e: ["На мЕцишше, дЕфка, смотри полуглазкОм, говори полуроткОм"]
- pom: [МинОк]
  rus:
    - t: пушной зверёк норка
      e: ["МинОк-от -скУрка глАдка"]
- pom: [МИфорь]
  rus:
    - t: древесный гриб чага
      e: ["МифОрь-от не хужЕ цЯю"]
      r: [пАкула]
- pom: [МогутнОй]
  rus:
    - t: могучий
      e: ["ОшкУй-от лютОй, да могутнОй"]
- pom: [МодЕлой]
  rus:
    - t: недоваренный, недопеченый, недожаренный
      e: ["МодЕлой хлеб спеклА"]
    - t: необожженный глиняный предмет
      e: ["КирпИць модЕлой"]
- pom: [МодЕт]
  rus:
    - t: так говорят о пище, которая плохо варится, плохо печется или плохо жарится
      e: ["ОгонЁцёк – то хУдо шАёт – дак и кАша модЕт"]
- pom: [МодОво]
  rus:
    - t: вразнобой, не по порядку, с большими отклонениями от нормы
      e: ["ПогОда модОва, не однорЕдиця", "МодОво какО-то построили"]
- pom: [МозглЯшша]
  rus:
    - t: промозглая, сырая и холодная (погода, время года и т.д.)
- pom: [МокрЕть]
  rus:
    - t: сырость
      e: ["МокрЕть да кассь на Улици"]
- pom: [МокрЯшшой]
  rus:
    - t: мокрый
      e: ["ОдЕжонка-то порАто мокрЯшша, скинывАй ей скорЕ-то"]
- pom: [МолИть]
  rus:
    - t: забивать скотину, зверя
      e: ["ОдЕжо ПошлИ котлЯна белькОф молИть", "КорОву-то молИть бУдём"]
- pom: [МонсИха]
  rus:
    - t: растение земляника
      e: ["МонсИхово лИссьё-то, да Ягод немА"]
- pom: [МОршни]
  rus:
    - t: промысловая обувь
      a: 'то же, что и *пОрушни*'
      r: [пОрушни]
- pom: [МорЯна]
  rus:
    - t: ветер, как правило – северных румбов, нагоняющий морскую воду в устья рек
- pom: [МорЯнка]
  rus:
    - t: сЁмга, выловленная осенью
- pom: [Мост, мосс]
  rus:
    - t: пол в избе
      a: '«бЕлой мост» – верхний пол, а «цЁрной мост» – нижний пол в избе'
    - t: Корабельная пристань, причал
      r: [брюгА]
- pom: [МотугА]
  rus:
    - t: большая стая птиц
      e: ["МотугА велИка гусЕй лЕтит"]
      r: [осОбо]
- pom: [МошЕнок]
  rus:
    - t: слабый, рыхлый кочан капусты, недооформившийся из-за ранних холодов
- pom: [МОшно]
  rus:
    - t: рыхло
      e: ["МОшно сЕно-то лофцЕ ветрИцце"]
      r: [ветрИцце]
- pom: [МошОк]
  rus:
    - t: морские водоросли анафельции с запутавшимися ракушками, камешками и прочим мусором
- pom: [Мох]
  rus:
    - t: торфяное болото
      e: ["БереЯ-то во мху где-ли рЫндат"]
- pom: [МохнАтка]
  rus:
    - t: гриб волнушка
      e: ["МохнАтки-то ломАли мАхонны"]
- pom: [МоховИк]
  rus:
    - t: гриб подберезовик
      e: ["МоховИк-от – жОлта гУбка"]
- pom: [МУжня]
  rus:
    - t: замужняя
      e: ["Она вЕть мУжня жОнка"]
- pom: [МУни, мУниди, мУди]
  rus:
    - t: яички у самца
- pom: [МУрга]
  rus:
    - t: карстовая воронка, яма
      e: ["В ПИнеги-то о край дерЕвни зовУт Рева мУрга"]
- pom: [МУрины]
  rus:
    - t: 'эпитет к бесам: бесы-мурины'
      r: [цемОрь]
    - t: мифические хозяева островов и пещер
      e: ["МУрин по лЕсу скАцёт"]
- pom: [МусЁнка]
  rus:
    - t: жидкая каша из ячменной муки
    - t: мелкий зернистый снег
      e: ["ПокатИла мусЁнка – засИверило"]
- pom: [МУсоко]
  rus:
    - t: плохая видимость
      e: ["МУсоко нАмори – цямрА, да пыль"]
- pom: [МутнИця]
  rus:
    - t: мутная вода в реке за несколько дней до ледохода
      r: [снежнИця, корневИця]
- pom: [МызА]
  rus:
    - t: отдельный сельскохозяйственный участок, принадлежащий конкретному роду или семье
      e: ["На Егорьеву мызУ сподИ – дак однА ремзА тАма-ка сЕйгод"]
- pom: [МырИть]
  rus:
    - t: вызывать зыбь на воде, направляя струю из-под воды
      a: ["МырИт рыба, идущая близко от поверхности воды", "МырЯт «тАйны кармакУлы»"]
- pom: [Мя]
  rus:
    - t: меня
      e: ["Ты мя-то, бывАт, замАлтывал?"]
- pom: [МяндАць]
  rus:
    - t: мелкий болотный сосновый лесок, с мягкой древесиной и с большим количеством заболони
      r: [кондАць]
- pom: [МятУха]
  rus:
    - t: мелкие плавучие льдины в море, в межсезонье
