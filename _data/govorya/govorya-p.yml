- pom: [ПАтрать]
  rus:
    - t: пачкать, метить что либо
      e: ["ШулихОна сАжёй ворОцця пАтрали"]
- pom: [ПАтровать]
  rus:
    - t: исхитряться, изловчаться
      e: ["Не пАтрую дверь-от открЫть", "Тут нать пАтровать"]
- pom: [ПАтоцьё]
  rus:
    - t: узкая протока
      e: ["По пАтоцью у евО нЁрши стАвлены"]
      r: [нЁрши]
- pom: [ПАужна]
  rus:
    - t: приём пищи в 14-16 часов, между обедом и ужином
      e: ["КалИтки-то во пАужны срЁцькали"]
- pom: [ПАужник]
  rus:
    - t: юго-западный ветер, дующий днём после обеда
- pom: [ПАуско, пАузок]
  rus:
    - t: долбленая из дерева небольшая (иногда одноместная) лодочка
      r: [осИнофка]
- pom: [ПАут]
  rus:
    - t: слепень
      e: ["У пАута бАски глАзки, да бОльно кусАт"]
- pom: [ПахАть]
  rus:
    - t: подметать, сметать с чего-либо (..)
      a: '*распахАть* — значит размести; *опахАть* – отряхнуть; *подпахАть* – слегка подмести и т.д.'
- pom: [ПахнУл]
  rus:
    - t: улетел, умчался
      e: ["МОшник спод ног пахнУл", "ЛОсо нАмори – хоть бы торОк пахнУл"]
      r: [пОрснуЛ]
- pom: [ПАхта]
  rus:
    - t: отвесная скала
      e: ["ОтпрЕдыш от пАхты мырИт"]
- pom: [ПАюс]
  rus:
    - t: пузырь
      e: ["От дожжА паюсА на водЫ", "РЫбьей пАюс"]
- pom: [ПекЁт]
  rus:
    - t: так говорят о месяце, если он ярко светит
      e: ["МЕсець новОйраз пекЁт, дак в кнИги бУквици видАть", "МЕсець пекЁт – дак лофцЕ иттИ"]
- pom: [ПелУша]
  rus:
    - t: брюхо, толстый живот
      e: ["ОбодвОренки-то мне Этта не своротИ, пелУша"]
- pom: [ПелУшьё]
  rus:
    - t: брюхо, толстый живот
      e: ["ВОна-ко у ей какО пелУшьё"]
- pom: [ПЕнник]
  rus:
    - t: делянка леса с невыкорчеванными пнями от спиленных деревьев
      e: ["Был-от лес, да нОнце тАма — капЕнник"]
- pom: [ПередЫзьё]
  rus:
    - t: место перед входом в избу
      e: ["НОги-то опашИ ометЁлоцькой в передЫзьи"]
- pom: [ПереймА]
  rus:
    - t: узкий перешеек между берегом и островом или между двумя островами
    - t: мель между островами, пересыхающая во время отлива
      e: ["ВОда спАла – дак прошОл по переймЫ"]
- pom: [ПерекАль]
  rus:
    - t: протока с быстрым течением между озёрами
      e: ["ВыходИ ко перекАлью"]
      r: [цЕльма]
- pom: [ПерекОп]
  rus:
    - t: искусственный канал, канава
      e: ["НарЫли нОньцё перекОпофф"]
- pom: [ПерекрОй]
  rus:
    - t: изменение фазы луны
      e: ["НОнце перекрОй – дак рыбАспит в яровОдьё-то"]
