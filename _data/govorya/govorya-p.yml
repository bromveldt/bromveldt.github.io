- pom: [ПЕхтёрь, пЕстерь]
  rus:
    - t: берестяной заплечный короб с крышкой
      e: ["ПОлнЁхонёк пЕхтёрь гУбок-от наломАл"]
- pom: [ПерцЯтни]
  rus:
    - t: перчатки
      e: ["С пУха гагАцьёго перцЯтни-то"]
- pom: [ПЕцьё]
  rus:
    - t: водоворот
      e: ["Об орлецЫ тАма-ка пЕцьё какО-то вЕртит"]
- pom: [ПЕцишшё]
