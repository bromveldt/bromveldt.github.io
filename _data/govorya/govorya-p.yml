- pom: [ПеремЕнной]
  rus:
    - t: расстроенный
      e: ["ВецЕрёссь-то ты порАто перемЕнной был"]
- pom: [ПересАда]
  rus:
    - t: переутомление
      e: ["Не пересАживайссе порАто"]
- pom: [ПересекАть]
  rus:
    - t: перебивать чужую речь, встревать в разговор
