      e: ["ПришлА бАбка пО лесы"]
- pom: [ПоберЕжник]
  rus:
    - t: северо-западный ветер
- pom: [ПОбыт]
  rus:
    - t: способ
      e: ["Тем же пОбытом лОдки-то лАдят"]
- pom: [ПОбытом]
  rus:
    - t: тем временем
      e: ["Мы-то пОбытом голОменем бежИм, а оне берЕже"]
- pom: [ПовАлиха]
