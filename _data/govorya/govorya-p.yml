letter: П
entries:
- pom: [Па]
  rus:
    - t: приставка означающая что-либо неполноценное
      r: [пАсижок, пАузок, пАдоцёрь, пАсынок, ...]
- pom: [ПАбеда]
  rus:
    - t: неудача
      e: ["У евО новА пАбеда"]
- pom: [ПАберег]
  rus:
    - t: обнажающаяся при убыли воды часть берега реки
      e: ["ОбрОн пал – сухО пАберег"]
      c: [зАберега]
- pom: [ПАва]
  rus:
    - t: красавица
      e: ["ДЕфка баскА – истовЁнно пАва"]
      c: [ белЯна ]
- pom: [ПАвесть]
  rus:
    - t: слух о чём-то или о ком-то
      e: ["Ни вЕсти об ем, ни пАвести"]
- pom: [ПАвна]
  rus:
    - t: исток ручья
    - t: Лужа вокруг родника
      e: ["Во пАвны-то водА порАто холОнна"]
- pom: [ПАдера, падЕрник]
  rus:
    - t: осенний северо-восточный холодный, «леденящий» ветер
- pom: [ПАдоцерь]
  rus: 
    - t: падчерица
      e: ["Не роннА онА емУ дОцерь – пАдоцерь"]
- pom: [ПадУн]
  rus: 
    - t: большой порог на реке, водопад
      e: ["ПадУн-от шумИт"]
- pom: [Падь]
  rus: 
    - t: пропасть, ущелье
      e: ["С горЫ падь смотрИ"]
- pom: [ПАзори]
  rus: 
    - t: далекий отблеск северного сияния, зарница
      e: ["На пАзорьи мАтка скОцит"]
- pom: [ПАзыбь]
  rus: 
    - t: волнисный след на песке, образующийся от ветра или движения воды
      e: ["На пАзыби-то цЕйны от пЯтыши?"]
- pom: [ПАколда, бАколда]
  rus: 
    - t: каша из снега и льда
      e: ["По пАколды на кАлгах лофцЕ бежАть"]
      r: [кАлги]
- pom: [ПАкула]
  rus: 
    - t: гриб-трутовик на берёзе и других деревьях
      e: ["ЦЯга-то на пАкулу не нахОдит", "с пАкулы, быват, цЯю не завАришь"]
      r: [гУба]
- pom: [ПАкша]
  rus:
    - t: неловкая, грубая рука
      e: ["КудЫ ты, пАполза, со своИма-то пАкшама?"]
    - t: Прозвище человека с грубыми руками
    - t: Левша
      e: ["ИстовЁнно пАкша – шУиця ты лЕшшова"]
      r: [шУиця]
- pom: [Пал]
  rus:
    - t: неожиданно наступил, быстро начался, налетел, возник
      a: 'Например\: сИверко пал, войнА пАла, морЯна пАла и т.д.'
      e: ["НовОйраз во гИрло падЁт взвОдёнь"]
- pom: [ПалЁшка]
  rus:
    - t: запечённая в золе картофелина
      r: [опАлиха]
- pom: [ПАлтух]
  rus:
    - t: горизонтальная жердь для вяления рыбы
      e: ["ПалтухА клАдёны на елуИ"]
      r: [Елуй]
- pom: [ПАполза]
  rus:
    - t: неуклюжий
      e: ["КудЫ ты, пАполза, суЁссе-то"]
- pom: [ПАрух]
  rus:
    - t: парень
      e: ["Парух-от порАто дракУнистой"]
      r: [дракУн]
- pom: [ПАски]
  rus:
    - t: сушёные тонкие шаньги, которыми питались промышленники во время промыслов
      e: ["ПАски поИссь да водЫ попИть – дак и дорОдно"]
- pom: [ПАссь]
  rus:
    - t: ловушка для рябчиков в виде настила из бревнышек, приподнимаемая над углублением в земле, куда заходит дичь
