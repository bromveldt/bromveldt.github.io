      r: [На сУтки двОи Истопели нать]
- pom: [Исть, исти]
  rus:
    - t: есть
      r: [Иссь порАто хоцЮ. НемА цегО ли поИсти?]
- pom: [ИттИть]
  rus:
    - t: идти
      r: [НЕкак иттИть-от, порАто вЫробилссе]
