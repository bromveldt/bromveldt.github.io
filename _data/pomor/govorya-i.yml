letter: И
entries:
- pom: [Игна]
  rus:
    - t: поводья для оленя
      r: [есА]
- pom: [Иготь]
  rus:
    - t: деревянная ступа
- pom: [Изба, Изьба]
  rus:
    - t: любое помещение в доме, но в отличие от России, не дом в целом
      e: ["В домУ-то Изьба-лЕтниця, да Изьба-зИмниця, да гОрниЦя, дастАя, да повЕть&hellip;"]
      a: Изьба – ударение на первый слог: «заходИ в Изьбу»
- pom: [ИзбомЫтьё]
  rus:
    - t: коллективная уборка в доме
      e: ["ПриходИте-ко, дЕфки, на избомЫтьё"]
- pom: [ИзбЫть]
  rus:
    - t: избежать
      e: ["Как бы мнекотОры-то избЫть?"]
- pom: [ИзвАжонной]
  rus:
    - t: холёный, изнеженный
      e: ["ИзвАжонной пАрух-от у ей"]
      r: [пАрух]
- pom: [ИзвАл]
  rus:
    - t: покатая плоскость
      e: ["Этта о мУрги-то извАл"]
- pom: [ИзгилЯцце]
  rus:
    - t: издеваться
      e: ["ПоштО над им изгилЯцце-то?"]
- pom: [ИзгодИть]
  rus:
    - t: найти, достать
      e: ["Где-ка Элаку рубАху изгодИл?"]
- pom: [ИзгОдно]
  rus:
    - t: непригодное
      e: ["КОтло-то уж изгОдно – рОзно, дак"]
- pom: [Издосель]
  rus:
    - t: давным-давно, испокон веков
      e: ["Издосель скАзывают: мОрё – нАшо пОле"]
- pom: [ИзлИха]
  rus:
    - t: сверх меры
      e: ["Ты, ужА, излИху-то несыпь"]
      r: [спроЁм]
- pom: [Излюбленной]
  rus:
    - t: избранный на сходе
      e: ["ИзлюбИли евО во юрОфшшики", "Стал ён излюбленным кОршшиком"]
- pom: [ИзрАз]
  rus:
    - t: выкройка
      e: ["По изрАзу шАпка-то шЫта"]
- pom: [ИзурОцить]
  rus:
    - t: изуродовать, изувечить
- pom: [ИкОта]
  rus:
    - t: индуцированный психоз
- pom: [икОтка]
  rus:
    - t: психическое заболевание (характерно для сёл Пинежского, Лешуконского и Мезенского районов Архангельской области и Печоры), проявляющееся в бессвязных выкриках больного человека (ИкОтник – человек, больной икОтой, передающий свое психическое состояние на окружающих).
- pom: [Иксы]
  rus:
    - t: притоки, впадающие в реку в её верховьях
    - t: небольшие речки, питающие водоём, реку
- pom: [Инде]
  rus:
    - t: даже
      e: ["Инде в цЕрьквы стоЯл"]
    - t: Кое-где, в некоторых местах
      e: ["Инде найдЁшь Ягод"]
- pom: [ИньшО]
  rus:
    - t: иное, некое, другое
      e: ["А иньшО-то нам и не нАть"]
- pom: [Ирвас]
  rus:
    - t: самец северного оленя на 2-м году жизни
- pom: [ИсконвЕцьной]
  rus:
    - t: изначальный
      e: ["На МАтку-то исконвЕцьной был ход"]
- pom: [Ископыть]
  rus:
    - t: следы от копыт
      e: ["По Ископыти, бывАт, нелОфко бежАть"]
- pom: [Исповоль]
  rus:
    - t: без напряжения, легко и свободно
      e: ["Вишь, сеть-то Исповоль ташшУ – пУста дак", "ВЕслишком-то Исповоль погрЁбыват"]
- pom: [Исполох]
