letter: Л
entries:
- pom: [ЛАбас]
  rus:
    - t: маленький охотничий амбарчик, поставленный на сваи или на спиленный сверху ствол дерева
      e: ["Он на йЕгны лАбас пОставил"]
- pom: [ЛабордА, лабордАн]
  rus:
    - t: сушёная, вяленая треска
- pom: [ЛафтАць]
  rus:
    - t: часть чего-либо, участок
      e: ["ВОна твой лафтАць", "ЛафтацЯма замАлтовал словА-то"]
- pom: [ЛагУн]
  rus:
    - t: деревянная кадушка для воды, с крышкой
- pom: [ЛАдить]
  rus:
    - t: готовиться, собираться
      e: ["Я ишшА скОлько-ль пожИть лАжу"]
- pom: [ЛадОм]
  rus:
    - t: по-хорошему, качественно
      e: ["ЛадОм дЕлай"]
- pom: [ЛазОм]
  rus:
    - t: плыть на лодке, отпехиваясь от дна веслом или шестом
      e: ["НовОйраз вОуско во курьИ грестИ, дак пёхАимссе лазОм"]
- pom: [ЛАйба]
  rus:
    - t: большая устаревшая двухмачтовая лодка с косыми парусами
- pom: [ЛАйбы]
  rus:
    - t: конные сани-розвальни
- pom: [ЛАйда]
  rus:
    - t: 'большое заливное пастбище с множеством *лыв*'
      e: ["ЛАйда, такО нИско, лЫвно мЕсто"]
    - t: илистое дно
      a: to zse czto *нЯша*
      e: ["Во лАйды кАрбас сел"]
      r: [нЯша]
- pom: [ЛАйма]
  rus:
    - t: заболоченный, заливной луг
      e: ["На лАймах трАвьё худО – цеморИци спроЕм"]
- pom: [ЛапугА]
  rus:
    - t: морская капуста
      r: [турА]
- pom: [ЛАста]
  rus:
    - t: возвышенный участок луга
      e: ["СЕно в лЫвы спОртицце, нать на лАсты стАвить"]
- pom: [ЛАстега]
  rus:
    - t: широкая лучина, дранка для изготовления из неё корзин и коробов. ЛАстегами меряли количество собранных ягод
      e: ["Во корзИны-то двОи лАстеги гонобЕли"]
- pom: [ЛАстофка]
  rus:
    - t: клиновидный кусок материи, часть выкройки
      e: ["ЛАстофку далА на рубАху"]
- pom: [ЛАтка]
  rus:
    - t: глиняная миска овальной формы, на которой жарят рыбу
      e: ["Во лАтки-то рЫбу несИ"]
- pom: [ЛАтницёк, лАтник]
  rus:
    - t:  декоративный поморский коврик, сшитый из разноцветных лоскутков, обрезков ткани, наложенных один на другой, наподобие черепицы
      e: ["БаскОй лАтницёк"]
- pom: [ЛАхта]
  rus:
    - t: маленький залив на море
      r: [губА]
    - t: болото вокруг озера
    - t: болото, прилежащее к озеру
- pom: [ЛахтАк]
  rus:
    - t: тюлень «морской заяц»
      e: ["ЛактакА, да тевякА хОжам"]
      r: [тЕвяк]
- pom: [ЛегАцце]
  rus:
    - t: развеваться, болтаться
      e: ["РукАф-от оторвАлссе, сбоку вЕснет, легАицце", "У ножикА дОлго цЕвьё, дакторцИт, легАицце", "РемкИ легАюцце, рубаха рОзна"]
- pom: [ЛедАшшой, ледЯшшой]
  rus:
    - t: худой, плохой
      e: ["ЛедЯшша лопотИна-то у евО – порАто рОзна да ремкАста"]
- pom: [ЛЕзьё]
  rus:
    - t: лезвие
      e: ["ЛЕзьё-то у ножикА – вОстро, цЕвьё – дОлго"]
- pom: [ЛЕмба]
  rus:
    - t: одно из обозначений лешего
      a: '*лешАк*, *лешшОй*'
      e: ["ЛЕзьё-то у ножикА – вОстро, цЕвьё – дОлго"]
      r: [вергьОй, цемОрь]
- pom: [ЛЕмех, лемЕха]
  rus:
    - t: 'деревянная черепица на *типушАх*'
      a: церковных главках
- pom: [ЛемЁха]
  rus:
    - t: подводная отмель в реке с глубокими ямами по сторонам
- pom: [ЛенУть]
  rus:
    - t: плеснуть, полить
      e: ["ЛиенИ-ко водЫ"]
    - t: сильно пойти (о дожде)
      e: ["ДОжжь-от какО лиенУл"]
- pom: [ЛепАк]
  rus:
    - t: летучая мышь
      r: [кожАн]
- pom: [ЛесИна]
  rus:
    - t: дерево
      e: ["СЕрки рАдиЛи – свЯжну лесИну копАли"]
- pom: [ЛЕстофка]
  rus:
    - t: лестница
    - t: особые кожанные или полотняные чётки у староверов
- pom: [ЛЕтник, лЕтень]
  rus:
    - t: южный ветер в Белом море
      r: [северИк]
- pom: [ЛЕши]
  rus:
    - t: лесные
      e: ["ЛЕши озёра, лЕши пУтики"]
- pom: [ЛЁкшма]
  rus:
    - t: заболоченное озеро
      e: ["Во ТрУфановой лЁкшмы водЫ-то уж немА"]
- pom: [ЛЁтат]
  rus:
    - t: летает
      e: ["КАня вОна лЁтат"]
- pom: [ЛЁшшадь]
  rus:
    - t: галька, ровная галечная отмель, чаще в устьях рек или на поворотах реки
    - t: Галечный плёс на быстром течении реки
      r: [Арешник]
- pom: [ЛёшшИцце]
  rus:
    - t: (о водной поверхности) сверкать на солнце, рябить
    - t: плескаться
      r: [РЫба-то в рекИ лёшшИцця]
- pom: [ЛИва]
  rus:
    - t: проливной дождь, ливень
      e: ["ЛИва-лИвушка – по потОки-то водА бежИт"]
- pom: [ЛиванУть]
  rus:
    - t: (о дожде) пойти с особой силой
      e: ["Гром-от тОркнул, дак дожжь-от крЯду ливанУл"]
- pom: [ЛиЁк]
  rus:
    - t: порция жидкости
      e: ["ЛиенИ-ко и мне брАжки лиЁк"]
- pom: [ЛиковАцце]
  rus:
    - t: целоваться
      e: ["ВОна какО ликУюцця – истовЁнно голубОцьки"]
- pom: [ЛиндА]
  rus:
    - t: жирная уха из семужьей головы, сваренная с ржаной мукой
- pom: [ЛипАть]
  rus:
    - t: метать, швырять
- pom: [ЛИпты]
  rus:
    - t: чулки из оленьего меха, шерстью внутрь
      e: ["Под бахИлы надЁваны дОлги лИпты"]
- pom: [ЛисвА, лисвЯга]
  rus:
    - t: лиственница
- pom: [ЛисвЯжной]
  rus:
    - t: лиственничный
      e: ["ЛисвЯжно-то бревнО водопЕльно – в водЫ тОнёт", "ЛисвЯжна сЕрка-то не порА-то горькА"]
- pom: [ЛистобОй]
  rus:
    - t: осенний юго-западный ветер, срывающий листья с деревьев
- pom: [ЛИхо]
  rus:
    - t: лениво
      e: ["ПорАто лИхо нОцесь-то фставАть", "НАмори лОсо – грестИ лИхо"]
      r: [«отЕть»]
- pom: [ЛОвдус]
  rus:
    - t: поплавок посередине невода
      r: [голОменшшик, берЕжник]
- pom: [ЛОдия]
  rus:
    - t: ладья, большое одномачтовое судно с прямым парусом
- pom: [Лой]
  rus:
    - t: однородная среда, единое целое
      e: ["РОпасоф немА – ЛОйно льдИньё", "Во стАрой-то доскИ разлОй", "ТЕценьи сойдУцце – дак зовУт сулОй"]
- pom: [ЛОйда]
  rus:
    - t: лежанка на сосновых или еловых ветвях
- pom: [ЛОква]
  rus:
    - t: глубокая лужа
- pom: [ЛокцЯ]
  rus:
    - t: 'особый затёс на стволе дерева, обозначающий владельца *пУтика*'
      e: ["ЗалокццИ лесИну-то, локцЮ на секИ"]
- pom: [ЛокцИть]
  rus:
    - t: затёсывать дерево
- pom: [ЛомнИк]
  rus:
    - t: ломкий наст, не выдерживающий человеческого веса
- pom: [ЛонИсь]
  rus:
    - t: в прошлом году
      e: ["ЛонИсь было не такО, какО сЕйгод"]
- pom: [ЛоньскОй]
  rus:
    - t: предыдущий, прежний
      e: ["ЛоньскИ-то хозЯва пОмерли"]
- pom: [ЛОпаста]
  rus:
    - t: часть прялки, к которой привязывали кудЕлю, шерсть
      r: [копылО]
- pom: [ЛОпотьё]
  rus:
    - t: одежда
      r: [плАтиньё]
- pom: [ЛопугА]
  rus:
    - t: речная и озерная пресноводная водоросль с широкими листьями
      e: ["ШшУка-то в лопугИ стоИт"]
- pom: [ЛОсо]
  rus:
    - t: штиль
      e: ["ТакО лОсо нАмори: тихА пАла(?), вОда крОтка", "МОрё лосЕт"]
- pom: [Лох]
  rus:
    - t: тощее и бледное мясо отнерестившейся сёмги
    - t: самец сёмги
- pom: [ЛохтА]
  rus:
    - t: вышка у дома, чердак
- pom: [ЛоцЯк]
  rus:
    - t: жук
      e: ["Болыи ухАньской лоцЯк"]
- pom: [ЛУда]
  rus:
    - t: длинная каменистая мель с множеством островков, идущая у берега моря
    - t: каменистый остров, лишённый растительности
- pom: [ЛузАн]
  rus:
    - t: одежда охотников, накидка, надеваемая через голову, имеющая по большому карману на животе и на спине, на поясе застегивается пришитым по нижнему краю кожаным ремнем 
- pom: [Лук]
  rus:
    - t: изогнутый участок реки или берега моря
      e: ["На десЯтой лук тонЯ"]
- pom: [ЛумдА]
  rus:
    - t: вода, выступившая поверх льда
      r: [шапнЯ, кОгва]
- pom: [ЛУмба]
  rus:
    - t: озеро на болоте из которого вытекает ручей
      e: ["Во лУмбы-то вода потОцьна, дак цистА, а в лЯги, бывАт, не такА цистА", "В лУмбалу-то рыба по рУцею находит, а в лЯгу – с пОлой водОй"]
- pom: [ЛУндош]
  rus:
    - t: высококачественное сукно
      e: ["СарафАн-от лУндошной, досЕльной"]
- pom: [ЛуцИть]
  rus:
    - t: освещать огнём, ослеплять рыбу с лодки в ночное время, чтобы колоть её острогОй
      e: ["Мы сЕйгод луцИть поЕдём на другО Озеро"]
- pom: [ЛЫва]
  rus:
    - t: лужа, остающаяся после прилива 
    - t: Топкое место, заливаемое водой и поросшее кустарником
      e: ["«Из лыв густых выходит волк» (М.В. Ломоносов. «Ода на взятие турецкой крепости Хотим», 1739 г.)"] 
- pom: [ЛыпАк]
  rus:
    - t: сухое, возвышенное место на болоте
      e: ["Я на лыпАк вЫзнелссе"]
- pom: [ЛыскАрь]
  rus:
    - t: железная лопата
- pom: [ЛысУн]
  rus:
    - t: взрослый, половозрелый тюлень, имеющий два чёрных пятна на спине, называемые «крЫльё»
      r: [утельгА]
- pom: [ЛютОй]
  rus:
    - t: огромный, гигантский, мощный
      e: ["ЛютОй ошкУй-то"]
- pom: [ЛЯга, лАга, лЯгва]
  rus:
    - t: 'заболоченная *турОй* и *нЯшей* лужа, оставшаяся после морского отлива'
      e: ["О сАму-то лЯгу немнОго морОшки"]
- pom: [ЛягУцця]
  rus:
    - t: неустойчивая, качающаяся из стороны в сторону
      e: ["МАцьта у евОн нова кАрбаса – порАто лягУцця"]
- pom: [Ляп]
  rus:
    - t: палка с железным крюком для захватывания рыбы, туш зверя
