letter: У
entries:
- pom: [УбОЙ]
  rus:
      - t: морской прибой
        e: ["В убОй-от вЫнёсло китА на Ягру"]
- pom: [УбОйной]
  rus:
  - t: плотный
    e: ["УбОйной снег, не рОхлой"]
- pom: [УбОр]
  rus:
  - t: укрытие
    e: ["СхоронИлось зверьЁ во убОрах"]
- pom: [УбрУс]
  rus:
  - t: вышитый золотом или жемчугом платок
- pom: [УвЕй]
  rus:
  - t: полоса неплодородной земли у опушки леса, куда падает тень от деревьев
    e: ["Мне-ка Элакой увЕй дАром не нать"]
- pom: [УгОр]
  rus:
  - t: холм, бугор
- pom: [УДА]
  rus:
  - t: рыболовный крючок
- pom: [УдавИцце]
  rus:
  - t: повеситься
    e: ["ФЁдор-то удавИлссе"]
- pom: [УдёбА, удьбА]
  rus:
  - t: рыбалка
    e: ["КакА эттА в Озере удьбА?", "Этта Озеро-то не удЁбно"]
- pom: [УжА]
  rus:
  - t: погоди, постой, прекрати и т.д.
    e: ["УжА-ты, оступИссь!"]
- pom: [УжАдать]
  rus:
  - t: жажда, нехватка воды
    e: ["Оне порАто ужАдали без водЫ-то"]
- pom: [УзгА]
  rus:
  - t: угол платка, полотенца, скатерти
    e: ["УзгУ-от у скАтёрти устрЯпали"]
- pom: [Уйма]
  rus:
  - t: великое множество чего-либо
    e: ["Уйма нарОду пришлО"]
    r: [спроЁм, излИха]
- pom: [УклАд]
  rus:
  - t: телосложение
    e: ["По уклАду-то свОму он невелИкой-немогУтной"]
- pom: [Улати]
  rus:
  - t: выть по волчьи
    e: ["ВОлки-то серЁтка нОци как заУлают, дак собАки забоЯцце, в Избу запрОсяцце"]
- pom: [Уледи]
  rus:
  - t: обувь из грубой кожи наподобие калош с загнутыми кверху носками, с пришитыми суконными или камусными @v@ голенищами
    v: кАмус
    e: ["В Уледях вЕкшу хОжали"]
    c: [тобуркА, яры, вЕкша]
- pom: [ульнУть]
  rus:
  - t: сбежать, скрыться, провалиться с головой
    e: ["НЁрпа-то во прОдуху быстЁхонько ульнУла", "НЕльма-то с рук ульнУла" ]
    c: [утОрнуть]
- pom: [УморИть]
  rus:
  - t: затушить
    e: ["УморИть нать в голАнки Угольё-то" ]
- pom: [УпАки]
  rus:
  - t: сапоги с загнутыми кверху носками
    e: ["НОньце-то упАки не нОсят" ]
- pom: [УпрЯк]
  rus:
  - t: время от утра до полудня или от полудня до вечера
    e: ["РОбили цЕлой упрЯк" ]
- pom: [УрАс]
  rus:
  - t: ушиб, синяк
    e: ["УрАс-от сИнёй на рукИ" ]
    c: [рАвга, жЕлвь, килА]
- pom: [УрЕць, урАс]
  rus:
  - t: небольшой сруб-ящик на четырёх столбах, наполненный землёй, куда весной высаживалась рассада для защиты ее от заморозков
    e: ["УрАс-от на шОлнце стАвлен", "Урець в зАтиньё не стАвят" ]
- pom: [УрОн, обрОн]
  rus:
  - t: морской отлив, убыль воды
    v: [обрОн]
    e: ["ВодА-то вурОн зарубИла"]
- pom: [УскОй]
  rus:
  - t: большая (более 10 метров) долбленая из ствола дерева узкая плоскодонная лодка, с нашитыми из досок бортами
    v: [пАуско]
    e: ["ДосЕльных-то ускОёв нОньце немА"]
- pom: [УсОй]
  rus:
  - t: густая похлёбка из репы с рыбным отваром
    e: ["УсОй поИссь – дак и дорОдно"]
- pom: [Усолонь]
  rus:
  - t: затенённое место, куда не достигают солнечные лучи
    v: [зАтиньё]
- pom: [УстАф]
  rus:
  - t: закон
    e: ["МорьскОй устАф промЫшленников", "Улицьной был ишшО устАф-от"]
- pom: [УстАвно]
  rus:
  - t: кличка, прозвище согласно «уличного устава» в деревне
    e: ["УстАвно у его бЫло – КабАтий"]
- pom: [УсторОньё]
  rus:
  - t: сторона, в стороне
    v: [вЫстафка]
    e: ["БАенка у ей за угОрьём, в усторОньё стАвлена"]
- pom: [УстрЯпать]
  rus:
  - t: запачкать
    v: [закАстить]
    e: ["Нать сАжёй-то о заслОнку не устрЯпацце"]
- pom: [УсЕдно]
  rus:
  - t: вязко
    v: [всАця]
    e: ["ЗемлЯ порАто усЕдна – всАциста"]
- pom: [УтельгА]
  rus:
  - t: взрослая родившая самка гренландского тюленя
- pom: [УтОрнуть]
  rus:
  - t: пропасть, провалиться
    c: [ульнУть]
    e: ["БагОр-от под лёд утОрнул"]
- pom: [УтОры]
  rus:
  - t: щели
    c: [шшЕльё, уборы]
- pom: [УхА]
  rus:
  - t: мясной или рыбный бульон
    e: ["ГусИной ухИ по-хлебАшь?", "Я зарЕжу петухА – будЁт скУсна ухА", "С сЁмги-то ухА – однА саломАта"]
- pom: [УхвОссьё, охвОссьё]
  rus:
  - t: нижняя по течению оконечность острова
    v: [взглАвьё]
    e: ["ОгорОдець-то наЖитовой кОшки об ухвОссьи"]
- pom: [УходИть]
  rus:
  - t: убить
    v: [взглАвьё]
    e: ["УходИли его двоИма-то"]
- pom: [УхОжи]
  rus:
  - t: угодья
    e: ["МоИ Этта лЕши ухОжи — моИ пУтики"]
- pom: [УцЮить]
  rus:
  - t: услышать
    e: ["Я не цЮю слов-от", "ДОлги Ухи – дак фсё веть уцЮит"]
