- myv: дивамс
  pos: гл.           # part of speech
  forms:
    - дива|мс
    - -сь             # verb ending after pipe in source
  ru:
    - удивиться
    - удивляться
    - поразиться
    - поражаться
  expressions:
    - myv: дивамс кулянтень
      ru: поразиться известию
  examples:
    - myv: Атясь мик дивамос прась ды эсь пачканзо кортась
      ru: Старик так удивился, что заговорил сам с собой
      source:
        author: Куляскин Д.
        title: Пичай
  subentries:
    - myv: дивамо
      pos: отгл. имя от дивамс
      ru:
        - удивление
      examples:
        - myv: Лиза натой кургонзояк автизе дивамодонть
          ru: Лиза от удивления даже рот разинула
          source:
            author: Тимохина Т.
            title: Кортыця грацъ

- myv: дива
  pos: сущ.
  ru:
    - диво
    - чудо
  senses:
    - sense: 1
      ru: диво, чудо
      expressions:
        - myv: мезень дива?
          ru: что за диво?
    - sense: 2
      label: вводн. сл.
      ru: удивительно
      expressions:
        - myv: дива, кода сон туевсь удивительно
          ru: удивительно, как ему удалось уехать
  idioms:
    - myv: дива арась
      ru: не удивительно
    - myv: дива сайтянзат диву даваться