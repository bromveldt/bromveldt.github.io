# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

encoding: "bom|utf-8"
mode: 'r:bom|UTF-8'

# Meta
title: Bruno Samueli's GitHub page
email: Bruno.Samueli@proton.me
description: >- # this means to ignore newlines until "baseurl:"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://bromveldt.github.io/" # the base hostname & protocol for your site, e.g. http://example.com
#twitter_username: jekyllrb
github_username:  bromveldt
env: production

# Build

markdown: kramdown
title_start: 'Bruno Samueli &#x40; GitHub Actions &#x214B;'
site_version: v0.2-gamma
robots: none,noindex,nofollow,noarchive,nocache,noyaca
viewport: width=device-width, initial-scale=1.0

defaults:
  - scope:
      path: "assets/images"
    values:
      image: true
  - scope:
      path: "assets/fonts"
    values:
      font: true
  - scope:
      path: "assets/webfonts"
    values:
      font: true
  - scope:
      path: "" # all files in the project
      type: "posts"
    values:
      layout: "default"
  - scope:
      path: "static/talen"
    values:
      layout: "simple"
  - scope:
      path: "/static/cv/cv-en.markdown"
      type: "pages" # previously `page` in Jekyll 2.2.
      permalink: "/cv/"
    values:
      layout: "cv" # overrides previous default layout
      author: "Bruno Samueli"
      topic: "curriculum vitae"
  - scope:
      path: "static/talen/slavisch/pom/govorya/entries"   # adjust to the actual folder
      type: "pages"                                      # or "posts" if you placed them there
    values:
      layout: "govorya"
      # Derive the letter from the filename and store it in a variable called `letter`
      letter: >-
        {{ page.name | split: "-" | last | remove: ".html" | remove: ".md" }}


exclude: [
  'design',
  'assets/lang',
  'icons',
  'templates',
  'README.md',
  'docker-compose.yml',
  'package.json',
  'yarn.lock',
  'Gemfile.lock',
  'static/ersa/ersa.markdown'
]

# Icons

#fontawesome:   https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css
fontawesome:   https://maxcdn.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.min.css
iconic:        https://cdnjs.cloudflare.com/ajax/libs/open-iconic/1.1.1/font/css/open-iconic.min.css
ionicons:      https://ionic.io/ionicons/2.0.1/css/ionicons.min.css
mdi:           https://cdn.materialdesignicons.com/2.0.46/css/materialdesignicons.min.css

# Variables

documentation: "/documentation/overview/start/"
download:      https://github.com/jgthms/bulma/releases/download/0.6.0/bulma-0.6.0.zip
github:        https://github.com/bromveldt/bulma
twitter:       https://twitter.com/jgthms
version:       0.6.0
vernum:        60

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-relative-links

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
