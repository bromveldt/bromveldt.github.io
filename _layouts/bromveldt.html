<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>
    <meta property="og:type" content="website"><!-- Open Graph -->
    <link rel="stylesheet" href="/assets/css/index.css?v=6">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icons8-star-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icons8-star-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/icons/icons8-star-64.png">
    <!-- Enhanced styling -->
    <link rel="stylesheet" href="assets/css/index.css?v=6">
    <link rel="stylesheet" href="{{ '/assets/css/bromveldt.css' | relative_url }}">

    {%- feed_meta -%}

    {% if page.custom_theme %}
    <link rel="stylesheet" href="{{ '/assets/css/themes/' | append: page.custom_theme | append: '.css' | relative_url }}">
    {% endif %}
    <link rel="schema.DCTERMS" href="http://purl.org/dc/terms/">
    <link rel="dcterms.relation" href="http://dublincore.org/documents/2000/08/15/dcq-html/">
    <meta name="dcterms.title"       content="Landing page for my personal GitHub Actions Web site">
    <meta name="dcterms.creator"     content="Bruno Samueli">
    <meta name="dcterms.created"     content="2019-09-15">
    <meta name="dcterms.format"      content="text/html">
    <meta name="dcterms.type"        content="Text">
    <meta name="dcterms.modified"    content="{{ site.time | date_to_xmlschema }}">
    <meta name="dcterms.subject"     content="software development, GitHub Actions, Jekyll">
    <meta name="dcterms.language"    content="en-US"> <!-- RFC 4646 / BCP 47 -->
    <meta name="dcterms.identifier"  content="{{ page.url | absolute_url }}">
    <meta name="dcterms.description" content="This is intended to showcase my HTML5 coding skills">
</head>
<body class="content-flow" style="padding-top: 5px; padding-bottom: 80px;">
<div class="content-wrapper">
    {% include header.html %}
    {% if page.layout_type == "grid" %}
    <div class="content-grid">
        <main class="content-main">
            {{ content }}
        </main>
        <aside class="content-sidebar">
            {% include table-of-contents.html %}
            {% include related-posts.html %}
        </aside>
    </div>
    {% else %}
    <section id="app-root" style="padding-top: 85px; padding-bottom: 80px;">
        {{ content }}
    </section>
    {% endif %}
    {% include footer.html %}

</div>
</body>
</html>
