<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;0,400;1,300&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Titillium+Web:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/index.css' | relative_url }}?v=12">
  <link rel="icon" href="{{ '/assets/icons/favicon.ico' | relative_url }}" type="image/x-icon"/>
  <link rel="shortcut icon" href="{{ '/assets/icons/favicon.ico' | relative_url }}"/>

  {%- feed_meta -%}
</head>
<body>
  {% include header.html %}
  <div class="content-shell">
    <article class="page-content">
      <h1>{{ page.title }}</h1>
      {{ content }}
    </article>
    {% include footer.html %}
  </div>
</body>
</html>
